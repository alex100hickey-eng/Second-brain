<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap');
  /* Palette and type follow HUD_STYLE.md so the chat reads as part of the deck.
     Chrome (header, nav, labels, buttons) takes the strict rules — Orbitron /
     Share Tech Mono, uppercase, 0.15em. Message text is CONTENT and takes the
     documented widget-content exception: natural case, 0.02-0.04em, readable
     size. Forcing tracking onto a conversation makes it unreadable. */
  :root {
    --hud-bg-edge:   #010a20;
    --hud-bg-center: #123a6e;
    --hud-cyan:      #4fd4e8;
    --hud-blue:      #2f6aa8;
    --hud-accent:    #9bf2fa;
    --hud-white:     #e8fdff;
    --hud-cyan-45: rgba(79, 212, 232, 0.45);
    --hud-cyan-25: rgba(79, 212, 232, 0.25);
    --hud-cyan-12: rgba(79, 212, 232, 0.12);
    --hud-fill:    rgba(79, 212, 232, 0.05);
    --hud-label:   rgba(150, 225, 245, 0.72);
    --hud-glow:        drop-shadow(0 0 4px rgba(79, 212, 232, 0.6));
    --hud-glow-strong: drop-shadow(0 0 4px rgba(79, 212, 232, 0.6))
                       drop-shadow(0 0 12px rgba(155, 242, 250, 0.5));

    /* Legacy names kept so the rest of the sheet keeps working, remapped to the deck. */
    --bg: var(--hud-bg-edge);
    --panel: rgba(79, 212, 232, 0.05);
    --line: rgba(79, 212, 232, 0.25);
    --text: #d8f4fb;
    --text-dim: rgba(150, 225, 245, 0.72);
    --accent: #4fd4e8;
    --accent-dim: rgba(79, 212, 232, 0.25);
    --user-bubble: rgba(79, 212, 232, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* the deck's radial glow, not a flat panel */
    background: radial-gradient(ellipse at 50% 42%, var(--hud-bg-center) 0%, var(--hud-bg-edge) 68%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Share Tech Mono', "SF Mono", monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    /* the PWA runs with viewport-fit=cover and a translucent status bar, so
       without this inset the header sits UNDER the notch / Dynamic Island */
    padding: calc(18px + env(safe-area-inset-top)) 24px 18px;
    border-bottom: 1px solid var(--hud-cyan-25);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--hud-cyan);
    filter: var(--hud-glow);
  }

  .pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--hud-cyan);
    filter: var(--hud-glow);
  }

  header nav {
    display: flex;
    align-items: center;
  }

  header nav a {
    color: var(--hud-label);
    text-decoration: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-left: 8px;
    padding: 6px 12px;
    border-radius: 0;                    /* the deck cuts corners, it doesn't round them */
    border: 1px solid transparent;
  }
  header nav a:hover {
    color: var(--hud-cyan);
    border-color: var(--hud-cyan-25);
    filter: var(--hud-glow);
  }

  header nav a.active {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  /* Browser pane — the live view of the cloud browser CLARVIS is driving.
     Chat and its input share the left column so the composer stays put when
     the pane opens; the pane is a sibling, not an overlay. */
  #workspace { flex: 1; display: flex; min-height: 0; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #browser-pane {
    width: min(46vw, 760px);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--hud-cyan-25);
    background: #05122a;
  }
  #browser-pane[hidden] { display: none; }
  .bp-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--hud-cyan-25);
    font-size: 11px; color: var(--hud-label);
  }
  .bp-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--hud-accent);
    box-shadow: 0 0 6px var(--hud-accent);
    animation: bp-pulse 2s ease-in-out infinite;
  }
  @keyframes bp-pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  #bp-url {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bp-btn {
    background: none; border: 1px solid var(--hud-cyan-25); color: var(--hud-cyan);
    font: inherit; font-size: 11px; line-height: 1;
    padding: 5px 8px; border-radius: 4px; cursor: pointer; text-decoration: none;
  }
  .bp-btn:hover { border-color: var(--hud-accent); color: var(--hud-accent); }
  #bp-frame { flex: 1; width: 100%; border: 0; background: #0b1a33; }

  @media (max-width: 900px) {
    /* No room to sit beside chat: the pane becomes the bottom half. */
    #workspace { flex-direction: column; }
    #browser-pane { width: 100%; height: 50vh; border-left: 0;
                    border-top: 1px solid var(--hud-cyan-25); }
  }

  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-dim);
    gap: 8px;
  }

  .empty-state .glyph {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .msg {
    display: flex;
    margin-bottom: 16px;
  }

  .msg.user { justify-content: flex-end; }

  /* CONTENT, not chrome — HUD_STYLE's widget-content exception applies: natural
     case, loose-but-not-HUD tracking, readable size. */
  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 0;
    line-height: 1.6;
    font-size: 14.5px;
    letter-spacing: 0.03em;
    white-space: pre-wrap;
    text-transform: none;
  }

  .msg.user .bubble {
    background: var(--hud-cyan-12);
    border: 1px solid var(--hud-cyan-25);
    /* the deck's cut corner, so a message reads as a panel on the same grid */
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }

  .msg.assistant .bubble {
    background: transparent;
    border-left: 2px solid var(--accent-dim);
    border-radius: 0;
    padding-left: 14px;
    white-space: normal;
  }

  .bubble h1, .bubble h2, .bubble h3 {
    font-size: 15px;
    margin: 14px 0 6px;
    color: var(--accent);
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble p { margin: 8px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .bubble pre {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble a { color: var(--accent); }

  .nav-badge {
    display: inline-block;
    min-width: 18px;
    text-align: center;
    background: #4a3a1a;
    color: #ffb454;
    font-size: 11px;
    font-weight: 700;
    border-radius: 20px;
    padding: 1px 6px;
    margin-left: 5px;
    vertical-align: 1px;
  }

  .tool-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0 6px 14px;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    animation: statusPulse 1.6s ease-in-out infinite;
  }

  .tool-status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex-shrink: 0;
  }

  @keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .thinking {
    display: flex;
    gap: 4px;
    padding: 12px 0;
  }

  .thinking span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  form {
    padding: 18px 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  /* Matches HUD.chatBar on the deck: the same angled frame (14px cuts on the
     same two corners), the same accent stroke and glow, the same translucent
     navy fill. The deck draws it in SVG because it sits in a scaled scene;
     here a clip-path over a bordered box gets the identical silhouette without
     the scene machinery. */
  /* Two clipped layers: ::before is the accent stroke (and carries the glow, so
     the glow never lands on the text), ::after is the navy fill inset by 1.2px.
     Net result is the deck's outlined octagon without an SVG. */
  .input-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 54px;
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 6px 14px 6px 22px;
  }
  .input-row::before, .input-row::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  .input-row::before {
    inset: 0;
    background: var(--hud-accent);
    filter: var(--hud-glow);
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px),
                       calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  }
  .input-row::after {
    inset: 1.2px;
    background: rgba(6, 20, 48, 0.62);
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px),
                       calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px);
  }
  .input-row > * { position: relative; z-index: 1; }

  .input-row:focus-within {
    border-color: var(--accent-dim);
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14.5px;
    letter-spacing: 0.03em;      /* what you type is content, not chrome */
    padding: 10px 0;
  }

  input[type="text"]::placeholder {
    color: var(--text-dim);
  }

  /* Same silhouette as HUD.chatBar's glyph buttons: 32px, transparent, cyan
     stroke, one clipped corner. */
  button {
    background: transparent;
    color: var(--hud-cyan);
    border: 1px solid var(--hud-cyan-45);
    border-radius: 0;
    padding: 10px 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    filter: var(--hud-glow);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    transition: color 140ms linear, border-color 140ms linear, background 140ms linear;
  }
  button:hover:not(:disabled) { color: var(--hud-accent); border-color: var(--hud-accent); }

  .input-row .mic-btn, .input-row #send-btn {
    width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .input-row #send-btn {
    width: auto; padding: 0 12px; height: 32px;   /* SEND stays a word, not a glyph:
      the deck's bar is a launcher, this one sends real messages and the label earns
      its width. Everything else about it matches. */
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* Voice: mic button in the input row + spoken-replies toggle in the nav */
  /* mic carries HUD.chatBar's SVG glyph now, so this is the deck's button:
     transparent, cyan stroke, one clipped corner, glow — the glyph inherits
     currentColor, which is what makes the listening/conversation states read. */
  .mic-btn {
    background: transparent;
    border: 1px solid var(--hud-cyan-45);
    border-radius: 0;
    padding: 0;
    line-height: 1;
    cursor: pointer;
    color: var(--hud-cyan);
    filter: var(--hud-glow);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .mic-btn svg { display: block; }

  .mic-btn.busy { opacity: .5; pointer-events: none; }
  .mic-btn.listening {
    border-color: #ff5c5c;
    color: #ff5c5c;
    animation: micPulse 1.2s ease-in-out infinite;
  }
  /* Conversation mode: the mic stays armed between turns, so it reads as a steady
     held state (cyan) rather than the red "recording right now" pulse. Both classes
     can be on at once — the cyan border wins while the red pulse keeps running, so
     Alex can still see the exact moment it's capturing him. */
  .mic-btn.conversation {
    border-color: var(--accent, #45d6ff);
    color: var(--accent, #45d6ff);
    box-shadow: 0 0 0 1px var(--accent, #45d6ff) inset;
  }
  @media (prefers-reduced-motion: reduce) {
    .mic-btn.listening { animation: none; }
  }

  /* Attached-video chip shown above the input row */
  .attach-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    max-width: fit-content;
  }
  .attach-chip.uploading { opacity: 0.6; }
  .attach-chip button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }

  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.5); }
    50% { box-shadow: 0 0 0 6px rgba(255, 92, 92, 0); }
  }

  @media (max-width: 480px) {
    .bubble { max-width: 88%; }
    header { padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    main { padding: 16px; }
    .title { display: none; }  /* hide "Online" text — the pulse dot says it */
    .brand span { white-space: nowrap; }
  }

  /* Phone navigation (2026-08-01). Two real problems on Alex's phone: the links
     sat under the status bar (no safe-area inset, above), and five of them
     overflowed a 390px header — "Voice" and "Clear" ran off the right edge.
     Below the HUD's own 700px breakpoint the nav becomes a fixed bottom bar:
     nothing overflows, and it's where a thumb already is. */
  @media (max-width: 699px) {
    header nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 70;
      justify-content: space-around;
      gap: 2px;
      background: rgba(1, 10, 32, 0.94);
      border-top: 1px solid var(--hud-cyan-25);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      backdrop-filter: blur(6px);
    }
    header nav a {
      margin-left: 0;
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 8px 4px;
      flex: 1 1 0;
      text-align: center;
    }
    /* keep the composer clear of the fixed bar */
    form {
      padding: 12px 16px;
      padding-bottom: calc(62px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="pulse"></div>
    <span>CLARVIS</span>
  </div>
  <div style="display: flex; align-items: center; gap: 4px;">
    <div class="title" id="status">Online</div>
    <nav>
      <a href="/" class="active">Chat</a>
      <a href="/dashboard">Dashboard<span class="nav-badge" id="pending-badge" style="display:none"></span></a>
      <a href="/memory" title="Browse & search everything you've discussed">Memory</a>
      <a href="#" id="voice-toggle" title="Toggle spoken replies">Voice</a>
      <a href="#" id="clear-chat" title="Start a fresh conversation">Clear</a>
    </nav>
  </div>
</header>

<div id="workspace">
<div id="chat-col">
<main id="chat">
  <div class="empty-state" id="empty-state">
    <div class="glyph">Standing by</div>
    <div>Ask about your agents, log a note, or just talk.</div>
  </div>
</main>

<form id="chat-form">
  <div class="attach-chip" id="attach-chip" style="display:none">
    <span id="attach-label"></span>
    <button type="button" id="attach-clear" title="Remove attachment">&times;</button>
  </div>
  <div class="input-row">
    <input type="text" id="message-input" placeholder="Ask CLARVIS…" autocomplete="off" />
    <input type="file" id="video-input" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,.mp4,.mov,.webm,.mkv,.avi,.m4v" style="display:none" />
    <button type="button" class="mic-btn" id="attach-btn" title="Attach a video to analyze">&#128206;</button>
    <button type="button" class="mic-btn" id="mic-btn" title="Hold a conversation — tap and speak"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="6" y="2" width="6" height="9" rx="3" fill="currentColor"/><path d="M 3.5 8.5 a 5.5 5.5 0 0 0 11 0 M 9 14 v 3 M 6 17 h 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button type="submit" id="send-btn">Send</button>
  </div>
</form>
</div><!-- /#chat-col -->

<aside id="browser-pane" hidden>
  <div class="bp-head">
    <span class="bp-dot" title="CLARVIS is driving this browser"></span>
    <span id="bp-url">Browser</span>
    <a class="bp-btn" id="bp-pop" href="#" target="_blank" rel="noopener"
       title="Open the live view in its own tab">↗</a>
    <button class="bp-btn" id="bp-close" title="Close the browser session">✕</button>
  </div>
  <iframe id="bp-frame" title="CLARVIS's browser"
          allow="clipboard-read; clipboard-write"></iframe>
</aside>
</div><!-- /#workspace -->

<script>
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('message-input');

  // Dashboard quick actions link here with ?q=… to pre-fill (not auto-send) the box.
  // The HUD chat bar adds &go=1: there the user ALREADY pressed send, so making
  // them press it a second time here was pure friction — that message auto-sends.
  (function prefillFromQuery() {
    try {
      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      const go = params.get('go') === '1';
      if (q) {
        input.value = q;
        history.replaceState(null, '', location.pathname);
        if (go) {
          // Deferred: the submit handler is attached later in this script, and a
          // requestSubmit before that would fall through to a native form post.
          setTimeout(() => form.requestSubmit(), 120);
        } else {
          setTimeout(() => { input.focus(); input.setSelectionRange(q.length, q.length); }, 60);
        }
      }
    } catch (e) { /* ignore */ }
  })();
  const sendBtn = document.getElementById('send-btn');
  const status = document.getElementById('status');

  // Conversation lives on the server (shared across all devices) — load it.
  (async () => {
    try {
      const res = await fetch('/api/history');
      const data = await res.json();
      for (const msg of data.messages || []) addMessage(msg.role, msg.content);
    } catch (e) { /* server unreachable — start empty */ }
  })();

  // Minimal safe markdown: escape all HTML first, then apply formatting.
  function renderMarkdown(text) {
    let s = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // fenced code blocks first, so nothing inside them gets formatted
    const blocks = [];
    s = s.replace(/```(?:\w*)\n?([\s\S]*?)```/g, (_, code) => {
      blocks.push(`<pre><code>${code}</code></pre>`);
      return `\x00BLOCK${blocks.length - 1}\x00`;
    });

    s = s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // group consecutive "- " lines into lists, wrap other runs in <p>
    const lines = s.split('\n');
    const out = [];
    let inList = false, para = [];
    const flushPara = () => {
      if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; }
    };
    for (const line of lines) {
      const li = line.match(/^\s*[-*] (.+)$/);
      const isBlock = /^(<h\d|\x00BLOCK)/.test(line.trim());
      if (li) {
        flushPara();
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push(`<li>${li[1]}</li>`);
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (isBlock) { flushPara(); out.push(line.trim()); }
        else if (line.trim() === '') flushPara();
        else para.push(line);
      }
    }
    flushPara();
    if (inList) out.push('</ul>');
    s = out.join('');

    return s.replace(/\x00BLOCK(\d+)\x00/g, (_, i) => blocks[+i]);
  }

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') bubble.innerHTML = renderMarkdown(text);
    else bubble.textContent = text;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  // Pending-approvals badge on the Dashboard nav link
  async function refreshBadge() {
    try {
      const res = await fetch('/api/pending-count');
      const data = await res.json();
      const n = data.count || 0;
      const badge = document.getElementById('pending-badge');
      badge.textContent = n;
      badge.style.display = n ? 'inline-block' : 'none';
    } catch (e) { /* ignore */ }
  }
  refreshBadge();
  setInterval(refreshBadge, 60000);

  function addThinking() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.id = 'thinking-indicator';
    wrap.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  function showToolStatus(label) {
    removeToolStatus();
    const el = document.createElement('div');
    el.className = 'tool-status';
    el.id = 'tool-status';
    el.textContent = label;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeToolStatus() {
    const el = document.getElementById('tool-status');
    if (el) el.remove();
  }

  // ---- Video attachment ----
  const videoInput = document.getElementById('video-input');
  const attachBtn = document.getElementById('attach-btn');
  const attachChip = document.getElementById('attach-chip');
  const attachLabel = document.getElementById('attach-label');
  const attachClear = document.getElementById('attach-clear');
  let attachedVideo = null;  // server-side filename once uploaded

  function clearAttachment() {
    attachedVideo = null;
    attachChip.style.display = 'none';
    attachChip.classList.remove('uploading');
    videoInput.value = '';
  }
  attachBtn.addEventListener('click', () => videoInput.click());
  attachClear.addEventListener('click', clearAttachment);
  videoInput.addEventListener('change', async () => {
    const file = videoInput.files[0];
    if (!file) return;
    attachChip.style.display = 'flex';
    attachChip.classList.add('uploading');
    attachLabel.textContent = 'Uploading ' + file.name + '…';
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/api/upload_video', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');
      attachedVideo = data.filename;
      attachChip.classList.remove('uploading');
      attachLabel.textContent = '🎬 ' + attachedVideo;
      if (!input.value.trim()) input.placeholder = 'What should I do with this video?';
      input.focus();
    } catch (err) {
      attachLabel.textContent = 'Upload failed: ' + err.message;
      attachedVideo = null;
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let message = input.value.trim();
    // A video can be sent with just an implied instruction.
    if (!message && attachedVideo) message = 'Take a look at this video and tell me what it is.';
    if (!message) return;

    const displayMessage = attachedVideo ? (message + '\n\n🎬 ' + attachedVideo) : message;
    let outboundMessage = message;
    if (attachedVideo) {
      outboundMessage = message + '\n\n[Attached video in my inbox — filename: "' + attachedVideo +
        '". Use the analyze_video tool on it to answer.]';
    }

    addMessage('user', displayMessage);
    clearAttachment();
    input.placeholder = 'Ask or tell me something...';
    input.value = '';
    sendBtn.disabled = true;
    status.textContent = 'Thinking...';
    addThinking();

    let bubble = null;
    let fullText = '';

    function handleEvent(ev) {
      if (ev.type === 'text') {
        removeThinking();
        removeToolStatus();
        if (!bubble) bubble = addMessage('assistant', '');
        fullText += ev.delta;
        bubble.innerHTML = renderMarkdown(fullText);
        chat.scrollTop = chat.scrollHeight;
      } else if (ev.type === 'replace' || ev.type === 'final') {
        // Streaming fell back to (or finished with) an authoritative full text. Replace whatever
        // streamed so the bubble always matches what the server saved — corrects partial text
        // left by a mid-stream failure; a no-op visually when streaming succeeded normally.
        removeThinking();
        removeToolStatus();
        if (typeof ev.text === 'string') {
          if (!bubble) bubble = addMessage('assistant', '');
          fullText = ev.text;
          bubble.innerHTML = renderMarkdown(fullText);
          chat.scrollTop = chat.scrollHeight;
        }
      } else if (ev.type === 'status') {
        removeThinking();
        status.textContent = 'Working...';
        showToolStatus(ev.label);
      } else if (ev.type === 'error') {
        removeThinking();
        removeToolStatus();
        addMessage('assistant', `Something went wrong: ${ev.message}`);
      }
    }

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: outboundMessage }),
      });

      if (!res.ok) {
        removeThinking();
        removeToolStatus();
        if (res.status === 401) {
          addMessage('assistant', 'Your session expired. Reloading the login page…');
          setTimeout(() => { location.href = '/login'; }, 1600);
        } else {
          addMessage('assistant', `The server returned an error (${res.status}). Your message is back in the box below — hit Send to try again.`);
          input.value = message;
        }
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (line) handleEvent(JSON.parse(line));
        }
      }

      removeThinking();
      removeToolStatus();
      // AWAIT the reply being spoken: in conversation mode the mic can only re-open
      // once CLARVIS has finished talking, or it records its own voice.
      if ((voiceOn || lastVoiceTurn) && fullText) { await speak(fullText); }
      lastVoiceTurn = false;
    } catch (err) {
      removeThinking();
      removeToolStatus();
      addMessage('assistant', 'Connection error — your message was not lost, it\'s back in the box below. Hit Send to retry.');
      input.value = message;
    } finally {
      sendBtn.disabled = false;
      status.textContent = 'Online';
      input.focus();
      // Close the loop — including after an error, so one failed turn doesn't
      // silently drop Alex out of a hands-free conversation.
      armListening();
      // The browser pane checks now rather than waiting out its poll interval:
      // if this turn opened or closed a session, the pane should already agree.
      window.dispatchEvent(new Event('clarvis:turn-done'));
    }
  });

  // ===== VOICE (v1) =====
  // Push-to-talk transcribes LOCALLY with whisper.cpp: the mic records audio and
  // POSTs it to /api/transcribe, which runs the local Whisper model (no cloud) and
  // returns text that we drop into the input box for Alex to review and send. Spoken
  // replies use the browser's built-in voices by default (portable, works remotely);
  // the app also exposes /api/speak for the Mac's own `say` when it's the local machine.
  const micBtn = document.getElementById('mic-btn');
  const voiceToggle = document.getElementById('voice-toggle');
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const canSpeak = 'speechSynthesis' in window;
  let voiceOn = canSpeak && localStorage.getItem('jarvis-voice') === 'on';
  let recording = false;
  let mediaRecorder = null, chunks = [], micStream = null;

  function updateVoiceUI() {
    voiceToggle.classList.toggle('active', voiceOn);
    micBtn.classList.toggle('listening', recording);
    micBtn.classList.toggle('conversation', convoMode);
    micBtn.title = convoMode
      ? 'Conversation mode — just talk. Tap to end.'
      : (recording ? 'Recording — release to send' : 'Hold to talk, or tap for conversation mode');
  }

  // Turn markdown into something worth hearing.
  function speechText(md) {
    return md
      .replace(/```[\s\S]*?```/g, ' (code shown on screen) ')
      .replace(/`([^`\n]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/^#{1,3} /gm, '')
      .replace(/\*\*?|__?/g, '')
      .replace(/^\s*[-*] /gm, '')
      .trim();
  }

  // Jarvis's voice plays through WebAudio: an AudioContext unlocked by Alex's FIRST
  // tap anywhere satisfies autoplay policy forever after — a plain Audio().play()
  // outside a click handler gets silently blocked (the "no voice back" bug).
  let audioCtx = null, currentVoiceSrc = null;
  // Shared <audio> element for STREAMED replies (MediaSource needs an element;
  // WebAudio can't decode partial MP3s). Elements have their own autoplay gate,
  // separate from AudioContext — playing a silent clip inside the first real tap
  // unlocks THIS element for programmatic playback forever after. Same class of
  // fix as the original "no voice back" bug, applied to the second audio path.
  const streamEl = new Audio();
  let streamElUnlocked = false, streamActive = false;
  function ensureAudioCtx() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!streamElUnlocked) {
      streamElUnlocked = true;
      // Shortest valid silent MP3 frame; play+pause inside the gesture is enough.
      streamEl.src = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA'
                   + 'gICAgICAgICAgICAgICAgICAgICAgP//////////////////////////AAAAAExhdmM1OC4xMwAAAAAAAAAAAAAAACQCkAAAAAAAAAJx9jFs7wAAAAAAAAAAAAAAAAAAAAAA';
      streamEl.play().then(() => streamEl.pause()).catch(() => { streamElUnlocked = false; });
    }
  }
  document.addEventListener('pointerdown', ensureAudioCtx, { capture: true });
  function stopVoicePlayback() {
    if (currentVoiceSrc) { try { currentVoiceSrc.stop(); } catch (e) {} currentVoiceSrc = null; }
    if (streamActive) {
      streamActive = false;
      try { streamEl.pause(); streamEl.removeAttribute('src'); streamEl.load(); } catch (e) {}
    }
  }
  // Resolves when playback actually FINISHES (not when it starts) — conversation
  // mode can only re-open the mic once CLARVIS has stopped talking, or it would
  // record its own voice. stopVoicePlayback() fires onended too, so an interrupted
  // reply resolves rather than hanging the turn.
  async function playVoice(arrayBuffer) {
    ensureAudioCtx();
    if (!audioCtx) throw new Error('no AudioContext');
    const buf = await audioCtx.decodeAudioData(arrayBuffer);
    stopVoicePlayback();
    return new Promise((resolve) => {
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.onended = () => { if (currentVoiceSrc === src) currentVoiceSrc = null; resolve(); };
      src.start();
      currentVoiceSrc = src;
    });
  }
  let lastVoiceTurn = false;  // voice in → voice out, even with the Voice toggle off

  function browserSpeak(text) {
    return new Promise((resolve) => {
      if (!canSpeak) return resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('en') && v.localService)
        || speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
      if (voice) u.voice = voice;
      u.onend = resolve;
      u.onerror = resolve;   // a failed utterance must not strand the conversation
      speechSynthesis.speak(u);
    });
  }

  // Streamed playback: chunked MP3 through MediaSource, so the first words play
  // while the rest is still being synthesized (~4x faster to first sound, measured
  // 530ms vs 2100ms server-side). Resolves when playback ENDS — conversation mode
  // depends on that, same contract as playVoice. Rejects when streaming isn't
  // possible so speak() falls back to the buffered path.
  function speakStreaming(text) {
    return new Promise(async (resolve, reject) => {
      if (!streamElUnlocked || !window.MediaSource || !MediaSource.isTypeSupported('audio/mpeg')) {
        return reject(new Error('mse-unavailable'));   // iOS Safari lands here -> buffered path
      }
      let settled = false;
      const done = () => { if (!settled) { settled = true; streamActive = false; resolve(); } };
      const fail = (e) => { if (!settled) { settled = true; streamActive = false; reject(e); } };
      try {
        const res = await fetch('/api/speak', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, stream: true }),
        });
        if (!((res.headers.get('Content-Type') || '').includes('audio')) || !res.body) {
          return fail(new Error('no-audio-stream'));
        }
        const ms = new MediaSource();
        streamActive = true;
        streamEl.src = URL.createObjectURL(ms);
        streamEl.onended = done;
        // If stopVoicePlayback() cleared us (mic press interrupt), count as finished.
        streamEl.onemptied = () => { if (!streamActive) done(); };
        streamEl.onerror = () => fail(new Error('audio-element-error'));
        ms.addEventListener('sourceopen', async () => {
          try {
            const sb = ms.addSourceBuffer('audio/mpeg');
            const reader = res.body.getReader();
            const append = (buf) => new Promise((res2, rej2) => {
              sb.addEventListener('updateend', res2, { once: true });
              sb.addEventListener('error', rej2, { once: true });
              sb.appendBuffer(buf);
            });
            while (true) {
              const { done: eof, value } = await reader.read();
              if (eof) break;
              if (!streamActive) { reader.cancel(); return; }
              await append(value);
            }
            if (ms.readyState === 'open') ms.endOfStream();
          } catch (e) { fail(e); }
        }, { once: true });
        await streamEl.play();
      } catch (e) { fail(e); }
    });
  }

  async function speak(md) {
    const text = speechText(md);
    if (!text) return;
    stopVoicePlayback();
    try {
      await speakStreaming(text);
      return;
    } catch (err) { /* fall through to the buffered path */ }
    try {
      // Server decides the best voice: ElevenLabs MP3 (audio/mpeg) > Mac `say`
      // (json ok:true) > tell us to use browser voices.
      const res = await fetch('/api/speak', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const ctype = res.headers.get('Content-Type') || '';
      if (ctype.includes('audio')) {
        await playVoice(await res.arrayBuffer());
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (data.ok) return;  // the Mac already spoke it via `say` (synchronous server-side)
    } catch (err) { /* fall through to browser voices */ }
    await browserSpeak(text);
  }

  if (canSpeak) speechSynthesis.getVoices(); // warm the voice list (loads async)

  voiceToggle.addEventListener('click', (e) => {
    e.preventDefault();
    if (!canSpeak) return;
    voiceOn = !voiceOn;
    localStorage.setItem('jarvis-voice', voiceOn ? 'on' : 'off');
    if (!voiceOn) speechSynthesis.cancel();
    updateVoiceUI();
  });

  async function transcribeBlob(blob) {
    // iOS records audio/mp4; Chrome records audio/webm — name the file to match.
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
              : (blob.type || '').includes('ogg') ? 'ogg' : 'webm';
    const fd = new FormData();
    fd.append('audio', blob, 'clip.' + ext);
    input.placeholder = 'Transcribing…';
    micBtn.classList.add('busy');
    try {
      const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.text) {
        input.value = (input.value ? input.value + ' ' : '') + data.text;
        input.focus();
        // Voice should feel like conversation: send immediately unless Alex turned
        // auto-send off (localStorage jarvis-voice-autosend = 'off').
        lastVoiceTurn = true;  // spoken question → spoken answer, toggle or not
        // Conversation mode is a hands-free loop by definition, so it always sends —
        // the auto-send preference only governs one-shot hold-to-talk.
        if (convoMode || localStorage.getItem('jarvis-voice-autosend') !== 'off') {
          form.requestSubmit();
        }
      } else {
        input.placeholder = data.note ? ('Didn\'t catch that — ' + data.note) : 'Didn\'t catch that. Try again.';
        armListening();   // a missed turn shouldn't silently end the conversation
      }
    } catch (err) {
      input.placeholder = 'Transcription failed — type instead.';
      armListening();
    } finally {
      micBtn.classList.remove('busy');
      setTimeout(() => { input.placeholder = 'Ask or tell me something...'; }, 2500);
    }
  }

  // ===== CONVERSATION MODE (VAD) =====
  // Tap the mic ONCE and just talk: an analyser watches the mic's RMS level, decides
  // when Alex has stopped speaking, sends that turn, speaks the reply, and re-opens
  // the mic — no button press per turn. The threshold is calibrated against the room's
  // own noise floor at the start of every turn rather than hardcoded, because a quiet
  // office and a noisy kitchen have wildly different baselines.
  const VAD = {
    CALIBRATE_MS: 400,      // sample the room before judging anything as speech
    MARGIN: 2.2,            // speech must beat noiseFloor * MARGIN
    FLOOR_MIN: 0.008,       // ...and this absolute floor, for near-silent rooms
    MIN_SPEECH_MS: 250,     // ignore coughs, clicks and door bumps
    SILENCE_MS: 1100,       // silence after real speech that ends the turn
    START_GRACE_MS: 9000,   // no speech at all this long => Alex walked away
    MAX_TURN_MS: 30000,     // hard cap so a stuck mic can't record forever
  };
  let convoMode = false;
  let vadAnalyser = null, vadSource = null, vadTimer = null;
  let discardTurn = false;   // set when a turn should be dropped, not transcribed

  // --- VAD-DECISION-START (pure; extracted and unit-tested in run_tests.py) ---
  // Split out from the audio plumbing deliberately: the thresholds are the part most
  // likely to be wrong and the part Alex will want to tune, and they can be exercised
  // against synthetic level traces without a microphone. Everything above this is I/O;
  // everything here is arithmetic.
  function vadNewTurn(now) {
    return { t0: now, noiseFloor: 0, calibN: 0, speechStart: 0, lastLoud: 0, sawSpeech: false };
  }

  // Advances `s` by one sample. Returns what the turn should do next:
  //   'calibrating' | 'listening' | 'endTurn' | 'noSpeech' | 'maxTurn'
  function vadStep(s, rms, now, cfg) {
    // Learn the room's own noise floor first — a quiet office and a noisy kitchen
    // have wildly different baselines, so a hardcoded threshold suits neither.
    if (now - s.t0 < cfg.CALIBRATE_MS) {
      s.noiseFloor = (s.noiseFloor * s.calibN + rms) / (s.calibN + 1);
      s.calibN++;
      return 'calibrating';
    }
    const threshold = Math.max(s.noiseFloor * cfg.MARGIN, cfg.FLOOR_MIN);
    if (rms > threshold) {
      if (!s.speechStart) s.speechStart = now;
      s.lastLoud = now;
      // Sustained, not instantaneous: a cough or a door bump clears the threshold
      // for a moment but never for MIN_SPEECH_MS.
      if (!s.sawSpeech && now - s.speechStart >= cfg.MIN_SPEECH_MS) s.sawSpeech = true;
    }
    if (s.sawSpeech && s.lastLoud && now - s.lastLoud >= cfg.SILENCE_MS) return 'endTurn';
    if (!s.sawSpeech && now - s.t0 >= cfg.START_GRACE_MS) return 'noSpeech';
    if (now - s.t0 >= cfg.MAX_TURN_MS) return 'maxTurn';
    return 'listening';
  }
  // --- VAD-DECISION-END ---

  function stopVad() {
    if (vadTimer) { clearInterval(vadTimer); vadTimer = null; }
    if (vadSource) { try { vadSource.disconnect(); } catch (e) {} vadSource = null; }
    vadAnalyser = null;
  }

  function startVad() {
    stopVad();
    ensureAudioCtx();
    // No AudioContext (or no stream) means no VAD — the turn then simply runs until
    // MAX_TURN_MS or a tap, rather than the mic silently never closing.
    if (!audioCtx || !micStream) return false;
    try {
      vadSource = audioCtx.createMediaStreamSource(micStream);
      vadAnalyser = audioCtx.createAnalyser();
      vadAnalyser.fftSize = 1024;
      vadSource.connect(vadAnalyser);
    } catch (e) { stopVad(); return false; }

    const data = new Float32Array(vadAnalyser.fftSize);
    const state = vadNewTurn(performance.now());

    // setInterval, not requestAnimationFrame: rAF is throttled to ~0 in a background
    // tab, which would freeze the turn mid-sentence the moment Alex switches away.
    vadTimer = setInterval(() => {
      if (!recording || !convoMode || !vadAnalyser) { stopVad(); return; }
      vadAnalyser.getFloatTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);

      switch (vadStep(state, rms, performance.now(), VAD)) {
        case 'endTurn':
        case 'maxTurn':
          stopVad(); stopRecording();          // turn over -> transcribe + send
          break;
        case 'noSpeech':
          setConvoMode(false, 'Conversation mode off — I didn\'t hear anything.');
          break;
      }
    }, 60);
    return true;
  }

  // Re-open the mic after a reply. The short delay lets the tail of the spoken reply
  // (and any speaker ring-out) die down before the analyser calibrates the room.
  function armListening() {
    if (!convoMode || recording) return;
    setTimeout(() => {
      if (convoMode && !recording) startRecording(true);
    }, 350);
  }

  async function setConvoMode(on, note) {
    convoMode = on;
    if (on) {
      if (canSpeak) speechSynthesis.cancel();
      stopVoicePlayback();
      updateVoiceUI();                    // show the armed state while the mic opens
      if (!recording) {
        // If the mic never opens, startRecording has already cleared convoMode and
        // explained why — don't leave the UI claiming to be in a conversation.
        if (!await startRecording(true)) { updateVoiceUI(); return; }
      } else {
        startVad();
      }
    } else {
      stopVad();
      if (recording) { discardTurn = true; stopRecording(); }
    }
    if (note) {
      input.placeholder = note;
      setTimeout(() => { input.placeholder = 'Ask or tell me something...'; }, 3000);
    }
    updateVoiceUI();
  }

  async function startRecording(useVad) {
    try {
      // Echo cancellation matters most in conversation mode: without it the mic
      // hears the speakers, and CLARVIS answers itself.
      // getUserMedia can hang indefinitely rather than reject (no device, or a
      // permission prompt nobody answers). Racing it against a timeout is what
      // stops conversation mode sitting there claiming to listen while it isn't.
      micStream = await Promise.race([
        navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('mic-timeout')), 10000)),
      ]);
    } catch (err) {
      convoMode = false;
      input.placeholder = err && err.message === 'mic-timeout'
        ? 'Mic didn\'t open — check that a microphone is connected.'
        : 'Mic permission needed — allow it and try again.';
      setTimeout(() => { input.placeholder = 'Ask or tell me something...'; }, 3000);
      updateVoiceUI();
      return false;
    }
    // Everything past getUserMedia can throw too — MediaRecorder construction fails
    // on some devices/codecs even after permission is granted. Unguarded, that left
    // conversation mode stranded: UI armed, nothing actually listening.
    try {
      chunks = [];
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
        const mime = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
        if (discardTurn) { discardTurn = false; chunks = []; return; }
        if (chunks.length) transcribeBlob(new Blob(chunks, { type: mime }));
      };
      mediaRecorder.start();
    } catch (err) {
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      convoMode = false;
      recording = false;
      input.placeholder = 'Couldn\'t start recording on this device — type instead.';
      setTimeout(() => { input.placeholder = 'Ask or tell me something...'; }, 3000);
      updateVoiceUI();
      return false;
    }
    recording = true;
    if (useVad) startVad();
    updateVoiceUI();
    return true;
  }

  function stopRecording() {
    stopVad();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recording = false;
    updateVoiceUI();
  }

  if (!canRecord) {
    micBtn.style.display = 'none'; // no mic API here — typing (incl. dictation tools) still works
  } else {
    // HOLD to talk (release = transcribe + send) for a one-shot question, or quick
    // TAP to enter CONVERSATION MODE and just keep talking. Recording starts on
    // pointerdown either way, so a tap loses none of the first word — the release
    // timing decides which mode that already-running recording belongs to.
    let pressT = 0, held = false;
    const HOLD_MS = 350;
    micBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (convoMode) { setConvoMode(false, 'Conversation mode off.'); return; }
      pressT = Date.now(); held = false;
      if (!recording) {
        if (canSpeak) speechSynthesis.cancel();
        stopVoicePlayback();  // pressing the mic interrupts CLARVIS mid-sentence
        startRecording(false);
        held = true;  // started by this press — release decides hold vs conversation
      }
    });
    micBtn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      if (convoMode) return;
      const dur = Date.now() - pressT;
      if (held && dur >= HOLD_MS) stopRecording();       // hold-to-talk release
      else if (held) setConvoMode(true);                 // quick tap = conversation mode
      else if (recording) stopRecording();               // tap while recording = stop
    });
    micBtn.addEventListener('pointerleave', () => {
      // Finger slid off mid-hold: treat as release so recording doesn't run away.
      if (!convoMode && held && recording && Date.now() - pressT >= HOLD_MS) stopRecording();
    });
    micBtn.addEventListener('contextmenu', (e) => e.preventDefault()); // no long-press menu on iOS
  }
  if (!canSpeak) voiceToggle.style.display = 'none';
  updateVoiceUI();

  document.getElementById('clear-chat').addEventListener('click', async (e) => {
    e.preventDefault();
    try { await fetch('/api/history/clear', { method: 'POST' }); } catch (err) {}
    location.reload();
  });

  input.focus();

  /* ---- Browser pane -------------------------------------------------------
     Shows the live view of the cloud browser whenever CLARVIS has a session
     open. Polls /api/browser, which only reads module state — it never opens a
     session, so watching this page can't cost account minutes. */
  (function browserPane() {
    const pane = document.getElementById('browser-pane');
    const frame = document.getElementById('bp-frame');
    const urlEl = document.getElementById('bp-url');
    const pop = document.getElementById('bp-pop');
    let shownUrl = null;   // the src actually loaded, so polling never re-sets it

    function apply(info) {
      const live = info && info.active && info.live_url;
      if (!live) {
        if (shownUrl !== null) { frame.src = 'about:blank'; shownUrl = null; }
        pane.hidden = true;
        return;
      }
      if (info.live_url !== shownUrl) {
        // Re-assigning src on every poll would reload the view a few times a
        // minute and fight whatever CLARVIS is doing mid-page.
        frame.src = info.live_url;
        pop.href = info.live_url;
        shownUrl = info.live_url;
      }
      // Host first, path only if there is one: the domain is the bit worth
      // reading at a glance, and a long URL would clip it away.
      let label = info.url || 'Browser';
      try {
        const u = new URL(info.url);
        label = u.hostname + (u.pathname && u.pathname !== '/' ? u.pathname : '');
      } catch (e) { /* about:blank and friends aren't parseable — show as-is */ }
      urlEl.textContent = label;
      urlEl.title = info.url || '';
      pane.hidden = false;
    }

    async function poll() {
      try { apply(await (await fetch('/api/browser', { cache: 'no-store' })).json()); }
      catch (e) { /* a failed poll is not a reason to tear down a live view */ }
    }

    document.getElementById('bp-close').addEventListener('click', async () => {
      pane.hidden = true;                      // respond now, confirm after
      frame.src = 'about:blank'; shownUrl = null;
      try { await fetch('/api/browser/close', { method: 'POST' }); } catch (e) {}
      poll();
    });

    poll();
    setInterval(poll, 4000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
    // A turn that used the browser will have opened it by the time the reply
    // lands, so check immediately rather than waiting out the interval.
    window.addEventListener('clarvis:turn-done', poll);
  })();
</script>

</body>
</html>
