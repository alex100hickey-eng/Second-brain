<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/hud/hud.css?v=17">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }
  .nc { position: absolute; transform: translate(-50%, -50%); }
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
  .pagetitle { position: absolute; left: 60px; top: 40px;
    font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--hud-accent); filter: var(--hud-glow-strong); }
  .pagesub { position: absolute; left: 62px; top: 82px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    letter-spacing: 0.04em; color: #93c9dd; }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=17"></script>
<script>
  /* One template serves every expanded view; the page key comes from the URL
     so no server-side templating is needed (keeps this file previewable as a
     plain static file too). */
  const clip = (t, n) => (t || '').length > n ? t.slice(0, n - 1) + '\u2026' : (t || '');
  const money = v => '$' + Math.round(v || 0).toLocaleString();
  // cost figures need cents — rounding $2.74 to "$3" is misleading on a bill
  const money2 = v => '$' + (Math.round((v || 0) * 100) / 100).toFixed(2);
  const rows = (list, empty) => HUD.listRows({ rows: list, empty: empty });

  // a headline + wrapped body paragraph, for the learnings cards
  function card(head, body, foot) {
    const w = document.createElement('div');
    if (head) {
      const h = document.createElement('div');
      h.className = 'hud-bigstat-v';
      h.style.fontSize = '17px';
      h.style.lineHeight = '1.25';
      h.textContent = head;
      w.appendChild(h);
    }
    if (body) {
      const b = document.createElement('div');
      b.className = 'hud-bigstat-s';
      b.style.marginTop = '8px';
      b.style.whiteSpace = 'normal';
      b.style.lineHeight = '1.5';
      b.textContent = body;
      w.appendChild(b);
    }
    if (foot) {
      const f = document.createElement('div');
      f.className = 'hud-row-v';
      f.style.marginTop = '10px';
      f.style.fontSize = '11px';
      f.style.whiteSpace = 'normal';
      f.textContent = foot;
      w.appendChild(f);
    }
    return w;
  }

  const PAGES = {
    school: {
      title: 'School', sub: 'Mail \u00b7 assignments \u00b7 deadlines',
      panels: [
        { title: 'Inbox', shape: 'header', x: 60, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.mail && d.mail.recent) || []).map(r =>
            [clip(r.from + (r.preview ? ' \u2014 ' + r.preview : ''), 46),
             r.status === 'new' ? 'new' : '', r.status === 'new']),
            gone || 'Inbox clear') },
        { title: 'Assignments', shape: 'header', x: 530, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.assignments) || []).map(i =>
            [clip(i.text, 44), i.rel, /overdue|today|tomorrow/.test(i.rel)]),
            gone || 'No deadlines tracked') },
        { title: 'Upcoming', shape: 'cutbr', x: 1000, y: 380, w: 300, h: 300,
          fill: (d, gone) => rows(((d && d.schedule) || []).map(i =>
            [clip(i.text, 28), i.rel, /overdue|today/.test(i.rel)]),
            gone || 'Nothing upcoming') }
      ]
    },
    revenue: {
      title: 'Revenue', sub: 'Streams \u00b7 pipeline \u00b7 estimates',
      panels: [
        { title: 'Estimated monthly', shape: 'header', x: 60, y: 380, w: 380, h: 300,
          fill: (d, gone) => {
            const r = (d && d.revenue) || {};
            const wrap = document.createElement('div');
            wrap.appendChild(HUD.bigStat({ value: gone ? '\u2014' : money(r.est_monthly),
              sub: gone || 'from ' + (r.approved || 0) + ' approved ideas' }));
            const vals = (r.streams || []).map(s => Math.max(1, s.profit || 1));
            const sp = HUD.miniSpark({ values: vals.length ? vals : [1, 1, 1, 1],
              width: 300, height: 40 });
            sp.style.margin = '12px 0';
            wrap.appendChild(sp);
            wrap.appendChild(rows([['Ideas tracked', String(r.ideas || 0)],
              ['Approved', String(r.approved || 0)]], ''));
            return wrap;
          } },
        { title: 'Streams', shape: 'header', x: 480, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.revenue && d.revenue.streams) || []).map(s =>
            [clip(s.name, 40), s.profit ? money(s.profit) : (s.status || ''), !!s.profit]),
            gone || 'No ideas scouted yet') },
        { title: 'By status', shape: 'cutbr', x: 950, y: 380, w: 350, h: 300,
          fill: (d, gone) => {
            const c = (d && d.revenue && d.revenue.counts) || {};
            const ks = Object.keys(c);
            return rows(ks.map(k => [k, String(c[k])]), gone || 'Nothing to group');
          } }
      ]
    },
    schedule: {
      title: 'Schedule', sub: 'Events \u00b7 commitments',
      panels: [
        { title: 'Upcoming', shape: 'header', x: 60, y: 380, w: 420, h: 300,
          fill: (d, gone) => rows(((d && d.schedule) || []).map(i =>
            [clip(i.text, 42), i.rel, /overdue|today/.test(i.rel)]),
            gone || 'Nothing scheduled') },
        { title: 'Deadlines', shape: 'header', x: 520, y: 380, w: 440, h: 300,
          fill: (d, gone) => rows(((d && d.assignments) || []).map(i =>
            [clip(i.text, 44), i.rel, /overdue|today|tomorrow/.test(i.rel)]),
            gone || 'No deadlines') },
        { title: 'Sources', shape: 'cutbr', x: 1000, y: 380, w: 300, h: 300,
          fill: (d, gone) => {
            const all = ((d && d.schedule) || []).concat((d && d.assignments) || []);
            const by = {};
            all.forEach(i => { const k = i.source || 'other'; by[k] = (by[k] || 0) + 1; });
            return rows(Object.keys(by).map(k => [k, String(by[k])]),
              gone || 'No sources yet');
          } }
      ]
    },
    personal: {
      title: 'Personal', sub: 'Texts · email · people',
      panels: [
        { title: 'Recent', shape: 'header', x: 60, y: 380, w: 470, h: 300,
          fill: (d, gone) => rows((((d && d.personal) || {}).recent || []).map(r =>
            [clip(r.from + (r.preview ? ' — ' + r.preview : ''), 50),
             r.status === 'new' ? 'new' : '', r.status === 'new']),
            gone || 'Nothing recent') },
        { title: 'Needs a reply', shape: 'header', x: 570, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows((((d && d.personal) || {}).recent || [])
            .filter(r => r.status === 'new').map(r =>
              [clip(r.from, 32), r.source === 'imessage' ? 'text' : 'email', true]),
            gone || 'All caught up') },
        { title: 'Mix', shape: 'cutbr', x: 1040, y: 380, w: 260, h: 300,
          fill: (d, gone) => {
            const p = (d && d.personal) || {};
            return rows([['Texts', String(p.texts || 0)],
                         ['Emails', String(p.emails || 0)],
                         ['Unread', String(p.unread || 0), !!p.unread]],
                        gone || 'No data'); } }
      ]
    },
    learnings: {
      title: 'Today I learned', sub: 'Seven things, refreshed daily',
      feed: '/api/learnings',
      panels: [
        { title: 'Word of the day', shape: 'header', x: 60, y: 372, w: 350, h: 186,
          fill: (d, gone) => { const v = (d && d.vocab) || {};
            return gone ? rows([], gone)
              : card(v.word, v.meaning, v.example ? '“' + v.example + '”' : ''); } },
        { title: 'Quote', shape: 'header', x: 430, y: 372, w: 350, h: 186,
          fill: (d, gone) => { const q = (d && d.quote) || {};
            return gone ? rows([], gone)
              : card(null, q.text ? '“' + q.text + '”' : '', q.author ? '— ' + q.author : ''); } },
        { title: 'Verse', shape: 'header', x: 800, y: 372, w: 350, h: 186,
          fill: (d, gone) => { const v = (d && d.verse) || {};
            return gone ? rows([], gone) : card(v.reference, v.text, ''); } },
        { title: 'Song', shape: 'header', x: 1170, y: 372, w: 350, h: 186,
          fill: (d, gone) => { const s2 = (d && d.song) || {};
            return gone ? rows([], gone)
              : card(s2.title, s2.why, s2.artist ? '— ' + s2.artist : ''); } },
        { title: 'Money basics', shape: 'header', x: 60, y: 578, w: 470, h: 196,
          fill: (d, gone) => { const m = (d && d.money_tip) || {};
            return gone ? rows([], gone) : card(m.title, m.body, ''); } },
        { title: 'CLARVIS skill', shape: 'header', x: 550, y: 578, w: 470, h: 196,
          fill: (d, gone) => { const s3 = (d && d.clarvis_skill) || {};
            return gone ? rows([], gone)
              : card(s3.title, s3.body, s3.try_this ? 'Try: “' + s3.try_this + '”' : ''); } },
        { title: 'Opportunity', shape: 'cutbr', x: 1040, y: 578, w: 480, h: 196,
          fill: (d, gone) => { const o = (d && d.opportunity) || {};
            return gone ? rows([], gone)
              : card(o.title, o.body,
                  [o.effort, o.potential].filter(Boolean).join('  ·  ')); } }
      ]
    },
    health: {
      title: 'System health', sub: 'Watchdog · workers · running costs',
      panels: [
        { title: 'Status', shape: 'header', x: 60, y: 372, w: 420, h: 192,
          fill: (d, gone) => {
            const h = (d && d.health) || {};
            if (gone) return rows([], gone);
            const word = ({ healthy: 'All systems good', degraded: 'Degraded',
                            critical: 'Needs attention' }[h.overall] || h.overall || 'Unknown');
            const w = document.createElement('div');
            w.appendChild(HUD.bigStat({ value: word,
              sub: `${h.checks_ok || 0} of ${h.checks_total || 0} checks passing` }));
            const r = rows([
              ['Workers up', `${Object.values(h.workers || {}).filter(Boolean).length}/${Object.keys(h.workers || {}).length}`,
                (h.workers_down || []).length > 0],
              ['Open alerts', String((h.incidents || []).length), !!(h.incidents || []).length]
            ], '');
            r.style.marginTop = '12px';
            w.appendChild(r);
            return w; } },
        { title: 'Alerts', shape: 'header', x: 500, y: 372, w: 480, h: 192,
          fill: (d, gone) => {
            const h = (d && d.health) || {};
            const items = (h.failing || []).map(f =>
              [clip(f.name + ' — ' + (f.detail || f.status || ''), 46), 'check', true])
              .concat((h.workers_down || []).map(n => [clip(n, 40), 'worker down', true]))
              .concat((h.incidents || []).map(i =>
                [clip((i.component || '?') + ' — ' + (i.message || ''), 46), i.level || '', true]));
            return rows(items, gone || 'Nothing wrong right now'); } },
        { title: 'Workers', shape: 'cutbr', x: 1000, y: 372, w: 300, h: 192,
          fill: (d, gone) => {
            const w = ((d && d.health) || {}).workers || {};
            const ks = Object.keys(w);
            return rows(ks.map(k => [clip(k.replace(/^jarvis-/, ''), 24),
              w[k] ? 'up' : 'DOWN', !w[k]]), gone || 'No workers'); } },
        { title: 'What it costs to run', shape: 'header', x: 60, y: 584, w: 620, h: 190,
          fill: (d, gone) => {
            const c = ((d && d.health) || {}).cost || {};
            if (gone) return rows([], gone);
            const w = document.createElement('div');
            w.appendChild(HUD.bigStat({ value: money2(c.total_month), unit: '/mo',
              sub: `${money2(c.api_month)} metered API + ${money2(c.fixed_month)} fixed infra` }));
            const r = rows((c.lines || []).map(l =>
              [clip(l.name + (l.note ? ' — ' + l.note : ''), 44), money2(l.usd), l.kind === 'measured']),
              '');
            r.style.marginTop = '10px';
            w.appendChild(r);
            return w; } },
        { title: 'Budget & funding', shape: 'cutbr', x: 700, y: 584, w: 600, h: 190,
          fill: (d, gone) => {
            const c = ((d && d.health) || {}).cost || {};
            if (gone) return rows([], gone);
            const f = c.funding || {};
            const w = document.createElement('div');
            w.appendChild(rows([
              ['API budget cap', money2(c.budget)],
              ['Used this month', money2(c.api_month) + '  (' + Math.round((c.pct || 0) * 100) + '%)',
                (c.tier || 'ok') !== 'ok'],
              ['Budget tier', (c.tier || 'ok').toUpperCase(), (c.tier || 'ok') !== 'ok'],
              ['Paid from', f.source || 'not set']
            ], ''));
            const bar = HUD.dataBar({ width: 540, segments: 20,
              value: Math.min(100, Math.round((c.pct || 0) * 100)), flat: true });
            bar.style.margin = '12px 0 8px';
            w.appendChild(bar);
            if (f.note) {
              const n = document.createElement('div');
              n.className = 'hud-bigstat-s';
              n.style.whiteSpace = 'normal';
              n.textContent = f.note;
              w.appendChild(n);
            }
            return w; } }
      ]
    },
    toolkit: {
      title: 'CLARVIS toolkit', sub: 'Agents · workers · everything it can run',
      panels: [
        { title: 'Working right now', shape: 'header', x: 60, y: 372, w: 430, h: 192,
          fill: (d, gone) => {
            const t = (d && d.toolkit) || {};
            const items = (t.running || []).map(j => [clip(j.label, 40), 'running', true]);
            return rows(items, gone || 'Idle — nothing running'); } },
        { title: 'Queued', shape: 'header', x: 510, y: 372, w: 430, h: 192,
          fill: (d, gone) => rows((((d && d.toolkit) || {}).queued || []).map(j =>
            [clip(j.label, 40), 'queued']), gone || 'Queue empty') },
        { title: 'Background workers', shape: 'cutbr', x: 960, y: 372, w: 340, h: 192,
          fill: (d, gone) => rows((((d && d.toolkit) || {}).workers || []).map(w =>
            [clip(w.name.replace(/^jarvis-/, ''), 26), w.alive ? 'up' : 'DOWN', !w.alive]),
            gone || 'No workers') },
        { title: 'Tools ready to run', shape: 'header', x: 60, y: 584, w: 1240, h: 190,
          fill: (d, gone) => {
            const t = (d && d.toolkit) || {};
            if (gone) return rows([], gone);
            const wrap = document.createElement('div');
            wrap.style.display = 'grid';
            wrap.style.gridTemplateColumns = 'repeat(5, 1fr)';
            wrap.style.gap = '4px 18px';
            (t.groups || []).forEach(g => {
              const col = document.createElement('div');
              const h = document.createElement('div');
              h.className = 'hud-row-v';
              h.style.fontSize = '11px';
              h.textContent = g.group + ' (' + g.tools.length + ')';
              col.appendChild(h);
              const body = document.createElement('div');
              body.className = 'hud-bigstat-s';
              body.style.whiteSpace = 'normal';
              body.style.marginTop = '3px';
              body.textContent = g.tools.slice(0, 6).map(x => x.name).join(', ')
                + (g.tools.length > 6 ? ` +${g.tools.length - 6}` : '');
              col.appendChild(body);
              wrap.appendChild(col);
            });
            return wrap; } }
      ]
    },
    links: {
      title: 'Links', sub: 'Everything this system runs on',
      panels: [
        { title: 'Consoles & services', shape: 'header', x: 60, y: 372, w: 1240, h: 402,
          fill: (d, gone) => {
            const l = (d && d.links) || {};
            if (gone) return rows([], gone);
            const wrap = document.createElement('div');
            wrap.style.display = 'grid';
            wrap.style.gridTemplateColumns = 'repeat(3, 1fr)';
            wrap.style.gap = '18px 28px';
            Object.keys(l.groups || {}).sort().forEach(g => {
              const col = document.createElement('div');
              const h = document.createElement('div');
              h.className = 'hud-row-v';
              h.style.fontSize = '12px';
              h.style.marginBottom = '6px';
              h.textContent = g;
              col.appendChild(h);
              l.groups[g].forEach(item => {
                const a = document.createElement('a');
                a.href = item.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'hud-link-row';
                a.textContent = item.name;
                const note = document.createElement('span');
                note.textContent = item.note || '';
                a.appendChild(note);
                col.appendChild(a);
              });
              wrap.appendChild(col);
            });
            return wrap; } }
      ]
    },
    tasks: {
      title: 'Task queue', sub: 'What CLARVIS is working on',
      panels: [
        { title: 'Right now', shape: 'header', x: 60, y: 380, w: 400, h: 300,
          fill: (d, gone) => {
            const t = (d && d.task) || {};
            const wrap = document.createElement('div');
            wrap.appendChild(HUD.bigStat({
              value: gone ? '\u2014' : clip(t.name || 'Idle', 22),
              sub: gone || ('state: ' + (t.state || 'idle')) }));
            const total = (t.queued || 0) + (t.done || 0);
            const pct = total ? Math.round((t.done || 0) / total * 100) : 0;
            const b = HUD.dataBar({ width: 330, segments: 14, value: pct, flat: true });
            b.style.margin = '12px 0';
            wrap.appendChild(b);
            wrap.appendChild(rows([['Queued', String(t.queued || 0)],
              ['Done', String(t.done || 0)], ['Failed', String(t.failed || 0), !!t.failed]], ''));
            return wrap;
          } },
        { title: 'Open tasks', shape: 'header', x: 500, y: 380, w: 420, h: 300,
          fill: (d, gone) => rows((((d && d.task) || {}).tasks || []).map(t =>
            [clip(t.title, 40), t.status, t.status === 'doing']),
            gone || 'Nothing open') },
        { title: 'Recent intake', shape: 'cutbr', x: 960, y: 380, w: 340, h: 300,
          fill: (d, gone) => rows(((d && d.mail && d.mail.recent) || []).slice(0, 8).map(r =>
            [clip(r.from, 26), r.status || '']), gone || 'Nothing recent') }
      ]
    }
  };

  // page key: the URL segment when it names a known page, else ?p=, else school
  const SEG = (location.pathname.replace(/\/+$/, '').split('/').pop() || '').toLowerCase();
  const QP = (new URLSearchParams(location.search).get('p') || '').toLowerCase();
  const KEY = PAGES[SEG] ? SEG : (PAGES[QP] ? QP : 'school');
  const page = PAGES[KEY];

  const deck = document.getElementById('deck');
  // same shell as home; the reactor is the way back
  const { at, atC, label } = HUD.deckShell(deck, {
    reactorHref: '/', reactorTitle: 'Back to the deck',
    reactorX: 800, reactorY: 196, reactorSize: 300
  });

  const t = document.createElement('div');
  t.className = 'pagetitle'; t.textContent = page.title; deck.appendChild(t);
  const sb = document.createElement('div');
  sb.className = 'pagesub'; sb.textContent = page.sub; deck.appendChild(sb);

  // build the panels once, then refill their contents on every poll
  page.panels.forEach(p => {
    p._frame = HUD.widgetFrame({ width: p.w, height: p.h, shape: p.shape,
      title: p.title, role: 'panel-' + p.title.toLowerCase().replace(/\W+/g, '-') });
    at(p._frame, p.x, p.y);
  });

  function render(d, err) {
    const gone = err ? 'Data unavailable' : null;
    page.panels.forEach(p => HUD.fill(p._frame._content, p.fill(d, gone)));
  }
  render(null, null);
  // most pages read the shared HUD feed; a page may name its own endpoint via
  // `feed` (the learnings card is generated once a day, so it isn't polled)
  HUD.bindLive({ url: page.feed || '/api/hud',
    every: page.feed ? 0 : 60000, render });

  /* ===== shared chrome: back hint, chat bar, light decoration ===== */
  label('◄ Core — back to the deck', 668, 366, true);
  at(HUD.chatBar({ width: 620, action: '/chat-classic', role: 'chatbar' }), 490, 790);
  at(HUD.chevronPair({ count: 2, dir: 'right' }), 400, 806);
  at(HUD.chevronPair({ count: 2, dir: 'left' }), 1130, 806);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 60, 116);
  at(HUD.ladder({ height: 120, count: 7 }), 1520, 400);
  at(HUD.dotMatrix({ rows: 3, cols: 12, cell: 9, size: 4, fade: true }), 1330, 118);
  at(HUD.cornerMark({ size: 16, dir: 'tl' }), 60, 348);
  at(HUD.cornerMark({ size: 16, dir: 'tr' }), 1524, 348);
  at(HUD.cornerMark({ size: 16, dir: 'bl' }), 60, 700);
  at(HUD.cornerMark({ size: 16, dir: 'br' }), 1524, 700);

  window.CLARVIS_HUD = { deck, page: KEY,
    roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role) };
</script>
</body>
</html>
