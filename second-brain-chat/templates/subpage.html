<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/hud/hud.css?v=13">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }
  .nc { position: absolute; transform: translate(-50%, -50%); }
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
  .pagetitle { position: absolute; left: 60px; top: 40px;
    font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--hud-accent); filter: var(--hud-glow-strong); }
  .pagesub { position: absolute; left: 62px; top: 82px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    letter-spacing: 0.04em; color: #93c9dd; }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=13"></script>
<script>
  /* One template serves every expanded view; the page key comes from the URL
     so no server-side templating is needed (keeps this file previewable as a
     plain static file too). */
  const clip = (t, n) => (t || '').length > n ? t.slice(0, n - 1) + '\u2026' : (t || '');
  const money = v => '$' + Math.round(v || 0).toLocaleString();
  const rows = (list, empty) => HUD.listRows({ rows: list, empty: empty });

  const PAGES = {
    school: {
      title: 'School', sub: 'Mail \u00b7 assignments \u00b7 deadlines',
      panels: [
        { title: 'Inbox', shape: 'header', x: 60, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.mail && d.mail.recent) || []).map(r =>
            [clip(r.from + (r.preview ? ' \u2014 ' + r.preview : ''), 46),
             r.status === 'new' ? 'new' : '', r.status === 'new']),
            gone || 'Inbox clear') },
        { title: 'Assignments', shape: 'header', x: 530, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.assignments) || []).map(i =>
            [clip(i.text, 44), i.rel, /overdue|today|tomorrow/.test(i.rel)]),
            gone || 'No deadlines tracked') },
        { title: 'Upcoming', shape: 'cutbr', x: 1000, y: 380, w: 300, h: 300,
          fill: (d, gone) => rows(((d && d.schedule) || []).map(i =>
            [clip(i.text, 28), i.rel, /overdue|today/.test(i.rel)]),
            gone || 'Nothing upcoming') }
      ]
    },
    revenue: {
      title: 'Revenue', sub: 'Streams \u00b7 pipeline \u00b7 estimates',
      panels: [
        { title: 'Estimated monthly', shape: 'header', x: 60, y: 380, w: 380, h: 300,
          fill: (d, gone) => {
            const r = (d && d.revenue) || {};
            const wrap = document.createElement('div');
            wrap.appendChild(HUD.bigStat({ value: gone ? '\u2014' : money(r.est_monthly),
              sub: gone || 'from ' + (r.approved || 0) + ' approved ideas' }));
            const vals = (r.streams || []).map(s => Math.max(1, s.profit || 1));
            const sp = HUD.miniSpark({ values: vals.length ? vals : [1, 1, 1, 1],
              width: 300, height: 40 });
            sp.style.margin = '12px 0';
            wrap.appendChild(sp);
            wrap.appendChild(rows([['Ideas tracked', String(r.ideas || 0)],
              ['Approved', String(r.approved || 0)]], ''));
            return wrap;
          } },
        { title: 'Streams', shape: 'header', x: 480, y: 380, w: 430, h: 300,
          fill: (d, gone) => rows(((d && d.revenue && d.revenue.streams) || []).map(s =>
            [clip(s.name, 40), s.profit ? money(s.profit) : (s.status || ''), !!s.profit]),
            gone || 'No ideas scouted yet') },
        { title: 'By status', shape: 'cutbr', x: 950, y: 380, w: 350, h: 300,
          fill: (d, gone) => {
            const c = (d && d.revenue && d.revenue.counts) || {};
            const ks = Object.keys(c);
            return rows(ks.map(k => [k, String(c[k])]), gone || 'Nothing to group');
          } }
      ]
    },
    schedule: {
      title: 'Schedule', sub: 'Events \u00b7 commitments',
      panels: [
        { title: 'Upcoming', shape: 'header', x: 60, y: 380, w: 420, h: 300,
          fill: (d, gone) => rows(((d && d.schedule) || []).map(i =>
            [clip(i.text, 42), i.rel, /overdue|today/.test(i.rel)]),
            gone || 'Nothing scheduled') },
        { title: 'Deadlines', shape: 'header', x: 520, y: 380, w: 440, h: 300,
          fill: (d, gone) => rows(((d && d.assignments) || []).map(i =>
            [clip(i.text, 44), i.rel, /overdue|today|tomorrow/.test(i.rel)]),
            gone || 'No deadlines') },
        { title: 'Sources', shape: 'cutbr', x: 1000, y: 380, w: 300, h: 300,
          fill: (d, gone) => {
            const all = ((d && d.schedule) || []).concat((d && d.assignments) || []);
            const by = {};
            all.forEach(i => { const k = i.source || 'other'; by[k] = (by[k] || 0) + 1; });
            return rows(Object.keys(by).map(k => [k, String(by[k])]),
              gone || 'No sources yet');
          } }
      ]
    },
    tasks: {
      title: 'Task queue', sub: 'What CLARVIS is working on',
      panels: [
        { title: 'Right now', shape: 'header', x: 60, y: 380, w: 400, h: 300,
          fill: (d, gone) => {
            const t = (d && d.task) || {};
            const wrap = document.createElement('div');
            wrap.appendChild(HUD.bigStat({
              value: gone ? '\u2014' : clip(t.name || 'Idle', 22),
              sub: gone || ('state: ' + (t.state || 'idle')) }));
            const total = (t.queued || 0) + (t.done || 0);
            const pct = total ? Math.round((t.done || 0) / total * 100) : 0;
            const b = HUD.dataBar({ width: 330, segments: 14, value: pct, flat: true });
            b.style.margin = '12px 0';
            wrap.appendChild(b);
            wrap.appendChild(rows([['Queued', String(t.queued || 0)],
              ['Done', String(t.done || 0)], ['Failed', String(t.failed || 0), !!t.failed]], ''));
            return wrap;
          } },
        { title: 'Open tasks', shape: 'header', x: 500, y: 380, w: 420, h: 300,
          fill: (d, gone) => rows((((d && d.task) || {}).tasks || []).map(t =>
            [clip(t.title, 40), t.status, t.status === 'doing']),
            gone || 'Nothing open') },
        { title: 'Recent intake', shape: 'cutbr', x: 960, y: 380, w: 340, h: 300,
          fill: (d, gone) => rows(((d && d.mail && d.mail.recent) || []).slice(0, 8).map(r =>
            [clip(r.from, 26), r.status || '']), gone || 'Nothing recent') }
      ]
    }
  };

  // page key: the URL segment when it names a known page, else ?p=, else school
  const SEG = (location.pathname.replace(/\/+$/, '').split('/').pop() || '').toLowerCase();
  const QP = (new URLSearchParams(location.search).get('p') || '').toLowerCase();
  const KEY = PAGES[SEG] ? SEG : (PAGES[QP] ? QP : 'school');
  const page = PAGES[KEY];

  const deck = document.getElementById('deck');
  // same shell as home; the reactor is the way back
  const { at, atC, label } = HUD.deckShell(deck, {
    reactorHref: '/', reactorTitle: 'Back to the deck',
    reactorX: 800, reactorY: 196, reactorSize: 300
  });

  const t = document.createElement('div');
  t.className = 'pagetitle'; t.textContent = page.title; deck.appendChild(t);
  const sb = document.createElement('div');
  sb.className = 'pagesub'; sb.textContent = page.sub; deck.appendChild(sb);

  // build the panels once, then refill their contents on every poll
  page.panels.forEach(p => {
    p._frame = HUD.widgetFrame({ width: p.w, height: p.h, shape: p.shape,
      title: p.title, role: 'panel-' + p.title.toLowerCase().replace(/\W+/g, '-') });
    at(p._frame, p.x, p.y);
  });

  function render(d, err) {
    const gone = err ? 'Data unavailable' : null;
    page.panels.forEach(p => HUD.fill(p._frame._content, p.fill(d, gone)));
  }
  render(null, null);
  HUD.bindLive({ url: '/api/hud', every: 60000, render });

  /* ===== shared chrome: back hint, chat bar, light decoration ===== */
  label('◄ Core — back to the deck', 668, 366, true);
  at(HUD.chatBar({ width: 620, action: '/chat-classic', role: 'chatbar' }), 490, 790);
  at(HUD.chevronPair({ count: 2, dir: 'right' }), 400, 806);
  at(HUD.chevronPair({ count: 2, dir: 'left' }), 1130, 806);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 60, 116);
  at(HUD.ladder({ height: 120, count: 7 }), 1520, 400);
  at(HUD.dotMatrix({ rows: 3, cols: 12, cell: 9, size: 4, fade: true }), 1330, 118);
  at(HUD.cornerMark({ size: 16, dir: 'tl' }), 60, 348);
  at(HUD.cornerMark({ size: 16, dir: 'tr' }), 1524, 348);
  at(HUD.cornerMark({ size: 16, dir: 'bl' }), 60, 700);
  at(HUD.cornerMark({ size: 16, dir: 'br' }), 1524, 700);

  window.CLARVIS_HUD = { deck, page: KEY,
    roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role) };
</script>
</body>
</html>
