<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<link rel="stylesheet" href="/static/hud/hud.css?v=11">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* fixed-proportion HUD stage, scaled to fit the viewport */
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }        /* placed node (top-left anchored) */
  .nc { position: absolute; transform: translate(-50%, -50%); }  /* centered */
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=11"></script>
<script>
  const deck = document.getElementById('deck');
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit); fit();
  HUD.scanlineOverlay();

  // ---- placement helpers ----
  function at(node, x, y, role) {        // top-left anchored
    const d = document.createElement('div'); d.className = 'n';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function atC(node, x, y, role) {        // center anchored
    const d = document.createElement('div'); d.className = 'nc';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function label(text, x, y, hi) {
    const d = document.createElement('div'); d.className = 'lbl' + (hi ? ' hi' : '');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text;
    deck.appendChild(d); return d;
  }

  /* ===== FLOOR: trapezoid plane across the whole bottom edge.
     Overshoots the 1600x1000 stage on both sides and below so it still
     bleeds to the screen edges when the viewport letterboxes the deck. ===== */
  at(HUD.floorPlane({ width: 2100, height: 215, topInset: 880,
    vanishX: 1050, rows: 5, role: 'floor' }), -250, 845);
  // name lying flat on the floor, receding to the same vanishing point (x=800),
  // letter-spaced wide so it stretches most of the way across the plane
  at(HUD.floorText({ text: 'C.L.A.R.V.I.S', size: 100, tilt: 63, spacing: 0.46,
    perspective: 1900, opacity: 0.9, role: 'floor-name' }), 800, 906);

  /* ===== ORBIT RINGS: slow counter-rotating marks hugging the
     reactor, filling the gap between it and the widget ring ===== */
  atC(HUD.orbitRing({ r: 305, kind: 'dots', dur: 120 }), 800, 430);
  atC(HUD.orbitRing({ r: 318, kind: 'arcs', dur: 210, reverse: true }), 800, 430);

  /* ===== WIDGET FRAMES: SIXTEEN outlines ringing the reactor at 360deg
     — five across the top, five across the bottom, three per flank.
     Shapes pull from the older HUD builds (banner descent, ECG bite
     notch, plane heptagon, stat-panel brackets). Append widgets into
     each frame's ._content, or via CLARVIS_HUD.frame(role). ===== */
  // top arc — header bands, asymmetric cuts, layered ghosts
  at(HUD.widgetFrame({ width: 214, height: 86, shape: 'header',  role: 'w-tl' }), 58, 26);
  at(HUD.widgetFrame({ width: 168, height: 70, shape: 'cutbr',   role: 'w-t1' }), 302, 14);
  at(HUD.widgetFrame({ width: 226, height: 76, shape: 'bite',    role: 'w-tc' }), 698, 16);
  at(HUD.widgetFrame({ width: 170, height: 72, shape: 'layered', role: 'w-t2' }), 972, 42);
  at(HUD.widgetFrame({ width: 198, height: 76, shape: 'round',   role: 'w-tr' }), 1182, 14);
  // left flank — drifting in and out from the edge
  at(HUD.widgetFrame({ width: 212, height: 98, shape: 'header',  role: 'w-l1' }), 36, 178);
  at(HUD.widgetFrame({ width: 188, height: 90, shape: 'bracket', role: 'w-l2' }), 74, 322);
  at(HUD.widgetFrame({ width: 218, height: 94, shape: 'cuttl',   role: 'w-l3' }), 30, 458);
  // right flank
  at(HUD.widgetFrame({ width: 162, height: 74, shape: 'cutbr',   role: 'w-r1' }), 1398, 44);
  at(HUD.widgetFrame({ width: 202, height: 98, shape: 'header',  role: 'w-r2' }), 1350, 178);
  at(HUD.widgetFrame({ width: 216, height: 90, shape: 'layered', role: 'w-r3' }), 1304, 322);
  // low arc
  at(HUD.widgetFrame({ width: 208, height: 88, shape: 'round',   role: 'w-bl' }), 140, 630);
  at(HUD.widgetFrame({ width: 212, height: 88, shape: 'cutbr',   role: 'w-br' }), 1288, 630);

  /* ===== SPINNERS + instruments woven into the gaps ===== */
  atC(HUD.compassRing({ size: 100 }), 392, 244);
  atC(HUD.radarFan({ size: 100 }), 1214, 238);
  atC(HUD.flowerOfLife({ r: 30 }), 388, 616);
  atC(HUD.miniRings({ rings: [[20, 0.72], [14, 0.45]] }), 1216, 604);
  atC(HUD.donutGauge({ size: 88, value: 68, ticks: true }), 332, 428);
  atC(HUD.dial({ size: 92, value: 74 }), 1258, 440);
  atC(HUD.reticle({ size: 62 }), 470, 704);
  atC(HUD.reticle({ size: 62 }), 1122, 700);
  atC(HUD.nodeSquare({ size: 32 }), 296, 332);
  atC(HUD.nodeSquare({ size: 32, node: 'square' }), 1284, 340);

  /* ===== PATTERN FILL: reference-style scales, waves, marks ===== */
  at(HUD.rulerScale({ width: 430, from: 100, to: 600, step: 50 }), 586, 754);
  at(HUD.waveGraph({ width: 200, height: 62, curves: 3 }), 146, 742);
  at(HUD.waveGraph({ width: 190, height: 58, curves: 2 }), 1290, 738);
  at(HUD.candlesticks({ count: 5, width: 80, height: 54 }), 282, 122);
  at(HUD.mirrorBars({ rows: 10, width: 80, height: 58 }), 1216, 108);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 488, 150);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 968, 134);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 38 }), 246, 452);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 38 }), 1266, 512);
  at(HUD.dotMatrix({ rows: 3, cols: 12, cell: 9, size: 4, fade: true }), 44, 572);
  at(HUD.binaryStream({ rows: 3, cols: 10, cell: 11 }), 1336, 566);
  at(HUD.chevronRun({ count: 4, step: 17, h: 13 }), 452, 646);
  at(HUD.chevronRun({ count: 4, step: 17, h: 13 }), 1088, 640);
  at(HUD.hexCluster({ rows: 1, cols: 4, r: 11 }), 900, 724);
  at(HUD.circleGrid({ rows: 1, cols: 4, r: 6 }), 626, 716);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[34, 1], [52, 2], [24, 0]] }), 368, 534);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[26, 0], [44, 2], [36, 1]] }), 1226, 682);
  // scattered corner accents
  at(HUD.cornerMark({ size: 16, dir: 'tl' }), 262, 214);
  at(HUD.cornerMark({ size: 16, dir: 'br' }), 1330, 470);
  at(HUD.cornerMark({ size: 16, dir: 'bl' }), 300, 690);
  at(HUD.cornerMark({ size: 16, dir: 'tr' }), 1160, 566);

  /* ===== micro readouts + link traces ===== */
  label('5.232145', 46, 552);
  label('0.002157', 1338, 546);
  label('8.235687', 286, 104, true);
  label('0.0015741', 1216, 92, true);
  label('MDL.19', 372, 514);
  label('LNK.77', 1230, 662);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'fdot', end: 'none',
    paths: ['M 4 4 H 42 l 18 18 H 82'] }), 266, 266);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'none', end: 'fdot',
    paths: ['M 4 22 H 40 l 18 -18 H 82'] }), 1288, 272);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'fdot', end: 'none',
    paths: ['M 4 28 H 42 l 18 -18 H 82'] }), 280, 604);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'none', end: 'fdot',
    paths: ['M 4 6 H 40 l 18 20 H 82'] }), 1286, 588);

  /* ===== CENTERPIECE: the arc reactor (core links to chat) ===== */
  atC(HUD.coreReactor({ size: 560, href: '/chat-classic', linkTarget: '_blank',
    linkTitle: 'Open CLARVIS chat' }), 800, 430, 'core-reactor');

  // registry for live-data wiring: every gauge/readout/bar carries a data-role.
  // frame(role) returns a widget frame's content box — append widgets straight into it.
  window.CLARVIS_HUD = {
    deck,
    roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role),
    frame: (role) => {
      const n = deck.querySelector(`[data-role="${role}"]`);
      return n && n._content ? n._content : null;
    }
  };
</script>
</body>
</html>
