<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<link rel="stylesheet" href="/static/hud/hud.css?v=18">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }
  .nc { position: absolute; transform: translate(-50%, -50%); }
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=18"></script>
<script>
  const deck = document.getElementById('deck');
  // shared scaffolding: frame, floor, lettering, orbit rings, core reactor
  const { at, atC, label } = HUD.deckShell(deck, { reactorHref: '/chat-classic' });

  /* ===== WIDGET FRAMES — five live, the rest left open ===== */
  function widget(opts, x, y, build) {
    const f = HUD.widgetFrame(opts);
    if (build) build(f._content);
    at(f, x, y);
    return f;
  }

  const wSchedule = widget({ width: 214, height: 96, shape: 'header', role: 'w-tl',
    title: 'Schedule', href: '/schedule', linkTitle: 'Open schedule' }, 58, 26);
  const wTask = widget({ width: 212, height: 112, shape: 'header', role: 'w-l1',
    title: 'Active task', href: '/tasks', linkTitle: 'Open task queue' }, 36, 178);
  const wMail = widget({ width: 214, height: 120, shape: 'header', role: 'w-r2',
    title: 'School mail', href: '/school', linkTitle: 'Open school' }, 1338, 176);
  const wWork = widget({ width: 216, height: 100, shape: 'layered', role: 'w-r3',
    title: 'Assignments', href: '/school', linkTitle: 'Open school' }, 1304, 322);
  const wRev = widget({ width: 216, height: 102, shape: 'cutbr', role: 'w-br',
    title: 'Revenue', href: '/revenue', linkTitle: 'Open revenue' }, 1288, 630);
  // AUGUST — the money plan. Its own tile and its own tab, deliberately separate
  // from Revenue (which is the idea-scouting pipeline): this is one project with a
  // deadline, and burying it inside a general revenue view is how it stops being
  // the thing Alex looks at first.
  const wAugust = widget({ width: 230, height: 126, shape: 'header', role: 'w-b1',
    title: 'August', href: '/august', linkTitle: 'Open the August money plan' },
    1010, 640);
  // PERSONAL comms — texts + non-school mail (left, opposite school mail)
  const wPersonal = widget({ width: 200, height: 126, shape: 'header', role: 'w-l2',
    title: 'Personal', href: '/personal', linkTitle: 'Open personal inbox' }, 66, 320);
  // DAILY LEARNINGS — seven things to read once a day
  const wLearn = widget({ width: 216, height: 104, shape: 'header', role: 'w-bl',
    title: 'Today I learned', href: '/learnings', linkTitle: 'Open daily learnings' },
    136, 628);
  // SYSTEM HEALTH — the watchdog + what CLARVIS costs to run
  const wHealth = widget({ width: 206, height: 124, shape: 'header', role: 'w-tr',
    title: 'System', href: '/health', linkTitle: 'Open system health' }, 1182, 14);
  // TOOLKIT — agents, workers, tools
  const wKit = widget({ width: 226, height: 108, shape: 'header', role: 'w-tc',
    title: 'Toolkit', href: '/toolkit', linkTitle: 'Open CLARVIS toolkit' }, 698, 12);
  // LINKS — the consoles this system runs on
  const wLinks = widget({ width: 172, height: 92, shape: 'header', role: 'w-t1',
    title: 'Links', href: '/links', linkTitle: 'Open links' }, 302, 12);

  const clip = (s, n) => (s || '').length > n ? s.slice(0, n - 1) + '…' : (s || '');
  const money = v => '$' + Math.round(v || 0).toLocaleString();

  function render(d, err) {
    const gone = err ? 'Data unavailable' : null;

    // schedule — upcoming events + commitments
    HUD.fill(wSchedule._content, HUD.listRows({
      empty: gone || 'Nothing scheduled',
      rows: ((d && d.schedule) || []).slice(0, 3).map(i =>
        [clip(i.text, 42), i.rel, /overdue|today/.test(i.rel)])
    }));

    // active task — what CLARVIS is working on
    const t = (d && d.task) || {};
    const taskRows = [];
    if (t.name) taskRows.push([clip(t.name, 34), (t.state || '').toUpperCase(), t.state === 'running']);
    taskRows.push(['Queued', String(t.queued == null ? '—' : t.queued)]);
    HUD.fill(wTask._content, [
      HUD.listRows({ rows: gone ? [] : taskRows, empty: gone || 'Idle' }),
      (() => {
        const total = (t.queued || 0) + (t.done || 0);
        const pct = total ? Math.round((t.done || 0) / total * 100) : 0;
        const b = HUD.dataBar({ width: 168, segments: 12, value: pct, flat: true });
        b.style.marginTop = '8px';
        return b;
      })()
    ]);

    // school mail — unread count + who
    const m = (d && d.mail) || {};
    HUD.fill(wMail._content, [
      HUD.bigStat({ value: gone ? '—' : (m.unread || 0), unit: 'new',
        sub: gone || `${m.total || 0} recent · school inbox` }),
      HUD.listRows({
        empty: '',
        rows: (m.recent || []).filter(r => r.status === 'new').slice(0, 2)
          .map(r => [clip(r.from, 30), '', false])
      })
    ]);

    // personal — texts + non-school mail
    const p = (d && d.personal) || {};
    HUD.fill(wPersonal._content, [
      HUD.bigStat({ value: gone ? '—' : (p.unread || 0), unit: 'new',
        sub: gone || `${p.texts || 0} texts · ${p.emails || 0} emails` }),
      HUD.listRows({
        empty: '',
        rows: (p.recent || []).filter(r => r.status === 'new').slice(0, 2)
          .map(r => [clip(r.from, 26), '', false])
      })
    ]);

    // assignments — deadlines pulled out of intake
    HUD.fill(wWork._content, HUD.listRows({
      empty: gone || 'No deadlines',
      rows: ((d && d.assignments) || []).slice(0, 3).map(i =>
        [clip(i.text, 40), i.rel, /overdue|today|tomorrow/.test(i.rel)])
    }));

    // system health — status first, then what it costs to run
    const hh = (d && d.health) || {};
    const hc = hh.cost || {};
    const stateWord = gone ? '—'
      : ({ healthy: 'All good', degraded: 'Degraded', critical: 'Attention' }[hh.overall]
         || (hh.overall || 'unknown'));
    HUD.fill(wHealth._content, [
      HUD.bigStat({ value: stateWord,
        sub: gone || `${hh.checks_ok || 0}/${hh.checks_total || 0} checks · ${(hh.incidents || []).length} alert${(hh.incidents || []).length === 1 ? '' : 's'}` }),
      HUD.listRows({
        empty: '',
        rows: gone ? [] : [['Cost / mo', '$' + (Math.round((hc.total_month || 0) * 100) / 100).toFixed(2),
          (hc.tier || 'ok') !== 'ok']]
      })
    ]);
    wHealth.classList.toggle('hud-widget-alert', !gone && !!hh.alert);

    // toolkit — what's running vs what's available
    const tk = (d && d.toolkit) || {};
    HUD.fill(wKit._content, HUD.listRows({
      empty: gone || 'No tools',
      rows: gone ? [] : [
        ['Workers', `${tk.workers_alive || 0}/${tk.workers_total || 0}`,
          (tk.workers_alive || 0) < (tk.workers_total || 0)],
        ['Running now', String((tk.running || []).length), !!(tk.running || []).length],
        ['Tools ready', String(tk.tool_count || 0)]
      ]
    }));

    // links — the consoles this system runs on
    const lk = (d && d.links) || {};
    HUD.fill(wLinks._content, HUD.listRows({
      empty: gone || 'No links',
      rows: gone ? [] : [['Consoles', String(lk.count || 0)],
                         ['Groups', String(Object.keys(lk.groups || {}).length)]]
    }));

    // revenue — estimated monthly from approved ideas
    const r = (d && d.revenue) || {};
    HUD.fill(wRev._content, [
      HUD.bigStat({ value: gone ? '—' : money(r.est_monthly),
        sub: gone || `${r.approved || 0} approved · ${r.ideas || 0} ideas` }),
      (() => {
        const vals = (r.streams || []).slice(0, 8).map(s => Math.max(1, s.profit || 1));
        const sp = HUD.miniSpark({ values: vals.length ? vals : [1, 1, 1, 1],
          width: 150, height: 22 });
        sp.style.marginTop = '6px';
        return sp;
      })()
    ]);
  }

  render(null, null);                       // paint the empty state immediately
  HUD.bindLive({ url: '/api/hud', every: 60000, render });

  // Daily learnings live on their own endpoint and only change once a day,
  // so fetch once (every: 0) rather than polling — the card is model-generated
  // and cached server-side per date.
  function renderLearnings(d, err) {
    const v = (d && d.vocab) || {};
    HUD.fill(wLearn._content, [
      HUD.bigStat({ value: err ? '—' : clip(v.word || 'Loading…', 16),
        sub: err ? 'Data unavailable' : (v.meaning ? clip(v.meaning, 30) : 'word of the day') }),
      HUD.listRows({
        empty: '',
        rows: err ? [] : [['+6 more today', '', true]]
      })
    ]);
  }
  renderLearnings(null, null);
  HUD.bindLive({ url: '/api/learnings', every: 0, render: renderLearnings });

  // August tile: its own feed, so the shared /api/hud poll doesn't pay for reading
  // the vault tracker and prospect CSV on every deck refresh. The tile answers the
  // only two questions worth answering at a glance — how long is left, and what is
  // waiting on Alex — and the tab has the detail.
  function renderAugust(d, err) {
    const c = (d && d.clock) || {}, n = d && d.next, k = (d && d.counts) || {};
    HUD.fill(wAugust._content, [
      HUD.bigStat({ value: err ? '—' : String((d && d.days_to_deadline) || 0),
        sub: err ? 'Data unavailable' : 'days to Aug 31' }),
      HUD.listRows({
        empty: '',
        rows: err ? [] : [
          [clip(n ? n.title : 'Nothing waiting', 24), n && n.overdue ? 'overdue' : '',
           !!(n && n.overdue)],
          ['Warmup', c.warmup_started ? 'running' : 'not started', !c.warmup_started],
          ['Steps', (k.done || 0) + '/' + (k.total || 0)]
        ]
      })
    ]);
  }
  renderAugust(null, null);
  HUD.bindLive({ url: '/api/august', every: 60000, render: renderAugust });

  // --- open frames, awaiting assignment ---
  at(HUD.widgetFrame({ width: 170, height: 72, shape: 'layered', role: 'w-t2' }), 972, 42);
  at(HUD.widgetFrame({ width: 218, height: 94, shape: 'cuttl',   role: 'w-l3' }), 30, 458);
  at(HUD.widgetFrame({ width: 162, height: 74, shape: 'cutbr',   role: 'w-r1' }), 1398, 44);

  /* ===== CHAT BAR — above the floor lettering ===== */
  at(HUD.chatBar({ width: 620, action: '/chat-classic', role: 'chatbar' }), 490, 790);
  at(HUD.chevronPair({ count: 2, dir: 'right' }), 400, 806);
  at(HUD.chevronPair({ count: 2, dir: 'left' }), 1130, 806);

  /* ===== SPINNERS + instruments woven into the gaps ===== */
  atC(HUD.compassRing({ size: 100 }), 392, 244);
  atC(HUD.radarFan({ size: 100 }), 1214, 238);
  atC(HUD.flowerOfLife({ r: 30 }), 388, 616);
  atC(HUD.miniRings({ rings: [[20, 0.72], [14, 0.45]] }), 1216, 604);
  atC(HUD.donutGauge({ size: 88, value: 68, ticks: true }), 332, 428);
  atC(HUD.dial({ size: 92, value: 74 }), 1258, 440);
  atC(HUD.reticle({ size: 62 }), 470, 704);
  atC(HUD.reticle({ size: 62 }), 1122, 700);
  atC(HUD.nodeSquare({ size: 32 }), 296, 332);
  atC(HUD.nodeSquare({ size: 32, node: 'square' }), 1284, 340);

  /* ===== PATTERN FILL ===== */
  at(HUD.dotBlock({ rows: 4, cols: 10, cell: 9 }), 486, 74);
  at(HUD.dotBlock({ rows: 4, cols: 10, cell: 9 }), 900, 120);
  at(HUD.globeIcon({ size: 70 }), 500, 178);
  at(HUD.segRing({ size: 96, text: '02' }), 1050, 170);
  at(HUD.ladder({ height: 140, count: 9 }), 1180, 420);
  at(HUD.ladder({ height: 120, count: 7 }), 402, 470);
  at(HUD.rulerScale({ width: 330, from: 100, to: 400, step: 50 }), 60, 742);
  at(HUD.waveGraph({ width: 190, height: 58, curves: 2 }), 1290, 738);
  at(HUD.candlesticks({ count: 5, width: 80, height: 54 }), 282, 122);
  at(HUD.mirrorBars({ rows: 10, width: 80, height: 58 }), 1216, 152);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 488, 150);
  at(HUD.tickStrip({ count: 11, step: 11, h: 9 }), 968, 134);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 38 }), 246, 452);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 38 }), 1266, 512);
  at(HUD.dotMatrix({ rows: 3, cols: 12, cell: 9, size: 4, fade: true }), 44, 572);
  at(HUD.binaryStream({ rows: 3, cols: 10, cell: 11 }), 1336, 566);
  at(HUD.chevronRun({ count: 4, step: 17, h: 13 }), 452, 646);
  at(HUD.chevronRun({ count: 4, step: 17, h: 13 }), 1088, 640);
  at(HUD.hexCluster({ rows: 1, cols: 4, r: 11 }), 900, 724);
  at(HUD.circleGrid({ rows: 1, cols: 4, r: 6 }), 626, 716);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[34, 1], [52, 2], [24, 0]] }), 368, 534);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[26, 0], [44, 2], [36, 1]] }), 1226, 682);
  at(HUD.cornerMark({ size: 16, dir: 'tl' }), 262, 214);
  at(HUD.cornerMark({ size: 16, dir: 'br' }), 1330, 470);
  at(HUD.cornerMark({ size: 16, dir: 'bl' }), 300, 690);
  at(HUD.cornerMark({ size: 16, dir: 'tr' }), 1160, 566);

  /* ===== micro readouts + link traces ===== */
  label('5.232145', 46, 552);
  label('0.002157', 1338, 546);
  label('8.235687', 286, 104, true);
  label('0.0015741', 1216, 214, true);
  label('MDL.19', 372, 514);
  label('LNK.77', 1230, 662);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'fdot', end: 'none',
    paths: ['M 4 4 H 42 l 18 18 H 82'] }), 266, 266);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'none', end: 'fdot',
    paths: ['M 4 22 H 40 l 18 -18 H 82'] }), 1288, 272);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'fdot', end: 'none',
    paths: ['M 4 28 H 42 l 18 -18 H 82'] }), 280, 604);
  at(HUD.circuitTrace({ width: 86, height: 38, start: 'none', end: 'fdot',
    paths: ['M 4 6 H 40 l 18 20 H 82'] }), 1286, 588);

  // registry for live-data wiring: every gauge/readout/bar carries a data-role.
  window.CLARVIS_HUD = { deck, roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role) };
</script>
</body>
</html>
