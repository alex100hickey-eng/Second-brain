<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<link rel="stylesheet" href="/static/hud/hud.css?v=11">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* fixed-proportion HUD stage, scaled to fit the viewport */
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }        /* placed node (top-left anchored) */
  .nc { position: absolute; transform: translate(-50%, -50%); }  /* centered */
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=11"></script>
<script>
  const deck = document.getElementById('deck');
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit); fit();
  HUD.scanlineOverlay();

  // ---- placement helpers ----
  function at(node, x, y, role) {        // top-left anchored
    const d = document.createElement('div'); d.className = 'n';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function atC(node, x, y, role) {        // center anchored
    const d = document.createElement('div'); d.className = 'nc';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function label(text, x, y, hi) {
    const d = document.createElement('div'); d.className = 'lbl' + (hi ? ' hi' : '');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text;
    deck.appendChild(d); return d;
  }

  /* ===== FLOOR: trapezoid plane across the whole bottom edge.
     Overshoots the 1600x1000 stage on both sides and below so it still
     bleeds to the screen edges when the viewport letterboxes the deck. ===== */
  at(HUD.floorPlane({ width: 2100, height: 215, topInset: 880,
    vanishX: 1050, rows: 5, role: 'floor' }), -250, 845);
  // name lying flat on the floor, receding to the same vanishing point (x=800)
  at(HUD.floorText({ text: 'C.L.A.R.V.I.S', size: 92, tilt: 63,
    perspective: 1700, opacity: 0.85, role: 'floor-name' }), 800, 866);

  /* ===== ORBIT RINGS: slow counter-rotating marks hugging the
     reactor, filling the gap between it and the widget ring ===== */
  atC(HUD.orbitRing({ r: 305, kind: 'dots', dur: 120 }), 800, 430);
  atC(HUD.orbitRing({ r: 318, kind: 'arcs', dur: 210, reverse: true }), 800, 430);

  /* ===== WIDGET FRAMES: eight outlines ringing the reactor at
     360deg, shapes mixed. Append widgets into each ._content. ===== */
  at(HUD.widgetFrame({ width: 300, height: 150, shape: 'notch', role: 'w-tl' }), 90, 60);
  at(HUD.widgetFrame({ width: 340, height: 95,  shape: 'tab',   role: 'w-tc' }), 630, 12);
  at(HUD.widgetFrame({ width: 300, height: 150, shape: 'slant', role: 'w-tr' }), 1210, 60);
  at(HUD.widgetFrame({ width: 290, height: 170, shape: 'hex',   role: 'w-l'  }), 40, 330);
  at(HUD.widgetFrame({ width: 290, height: 170, shape: 'arrow', role: 'w-r'  }), 1270, 330);
  at(HUD.widgetFrame({ width: 300, height: 145, shape: 'trapz', role: 'w-bl' }), 90, 625);
  at(HUD.widgetFrame({ width: 340, height: 88,  shape: 'hex',   role: 'w-bc' }), 630, 755);
  at(HUD.widgetFrame({ width: 300, height: 145, shape: 'notch', role: 'w-br' }), 1210, 625);

  /* ===== SPINNERS in the four diagonal gaps ===== */
  atC(HUD.compassRing({ size: 108 }), 462, 268);
  atC(HUD.radarFan({ size: 108 }), 1140, 268);
  atC(HUD.flowerOfLife({ r: 32 }), 462, 596);
  atC(HUD.miniRings({ rings: [[20, 0.72], [14, 0.45]] }), 1140, 596);

  /* ===== PATTERN FILL between the frames ===== */
  at(HUD.dotMatrix({ rows: 3, cols: 14, cell: 9, size: 4, fade: true }), 96, 232);
  at(HUD.chevronRun({ count: 5, step: 18, h: 14 }), 96, 546);
  at(HUD.binaryStream({ rows: 3, cols: 12, cell: 11 }), 1216, 232);
  at(HUD.hatchStripes({ count: 7, gap: 11, len: 16 }), 1244, 546);
  at(HUD.tickStrip({ count: 10, step: 11, h: 9 }), 512, 120);
  at(HUD.tickStrip({ count: 10, step: 11, h: 9 }), 984, 120);
  at(HUD.circleGrid({ rows: 1, cols: 5, r: 6 }), 520, 736);
  at(HUD.hexCluster({ rows: 1, cols: 4, r: 11 }), 992, 734);
  atC(HUD.nodeSquare({ size: 40 }), 418, 430);
  atC(HUD.nodeSquare({ size: 40, node: 'square' }), 1184, 430);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[38, 1], [56, 2], [26, 0]] }), 404, 700);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[30, 0], [48, 2], [40, 1]] }), 1128, 700);

  /* ===== micro readouts + link traces ===== */
  label('5.232145', 96, 214);
  label('0.002157', 1216, 214);
  label('8.235687', 96, 786, true);
  label('0.0015741', 1216, 786, true);
  at(HUD.circuitTrace({ width: 120, height: 40, start: 'fdot', end: 'none',
    paths: ['M 4 4 H 70 l 22 22 H 116'] }), 340, 300);
  at(HUD.circuitTrace({ width: 120, height: 40, start: 'none', end: 'fdot',
    paths: ['M 4 26 H 48 l 22 -22 H 116'] }), 1140, 300);
  at(HUD.circuitTrace({ width: 120, height: 40, start: 'fdot', end: 'none',
    paths: ['M 4 30 H 70 l 22 -22 H 116'] }), 340, 560);
  at(HUD.circuitTrace({ width: 120, height: 40, start: 'none', end: 'fdot',
    paths: ['M 4 8 H 48 l 22 22 H 116'] }), 1140, 560);
  atC(HUD.marker({ size: 18 }), 560, 300);
  atC(HUD.marker({ size: 18 }), 1044, 560);

  /* ===== CENTERPIECE: the arc reactor (core links to chat) ===== */
  atC(HUD.coreReactor({ size: 560, href: '/chat-classic', linkTarget: '_blank',
    linkTitle: 'Open CLARVIS chat' }), 800, 430, 'core-reactor');

  // registry for live-data wiring: every gauge/readout/bar carries a data-role.
  // frame(role) returns a widget frame's content box — append widgets straight into it.
  window.CLARVIS_HUD = {
    deck,
    roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role),
    frame: (role) => {
      const n = deck.querySelector(`[data-role="${role}"]`);
      return n && n._content ? n._content : null;
    }
  };
</script>
</body>
</html>
