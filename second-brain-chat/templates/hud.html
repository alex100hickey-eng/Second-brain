<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<link rel="stylesheet" href="/static/hud/hud.css?v=10">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* fixed-proportion HUD stage, scaled to fit the viewport */
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }        /* placed node (top-left anchored) */
  .nc { position: absolute; transform: translate(-50%, -50%); }  /* centered */
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=10"></script>
<script>
  const deck = document.getElementById('deck');
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit); fit();
  HUD.scanlineOverlay();

  // ---- placement helpers ----
  function at(node, x, y, role) {        // top-left anchored
    const d = document.createElement('div'); d.className = 'n';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function atC(node, x, y, role) {        // center anchored
    const d = document.createElement('div'); d.className = 'nc';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function label(text, x, y, hi) {
    const d = document.createElement('div'); d.className = 'lbl' + (hi ? ' hi' : '');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text;
    deck.appendChild(d); return d;
  }
  function col(nodes, gap) {
    const w = document.createElement('div'); w.style.display = 'flex';
    w.style.flexDirection = 'column'; w.style.gap = (gap || 8) + 'px';
    w.style.alignItems = 'flex-start'; nodes.forEach(n => w.appendChild(n)); return w;
  }
  function row(nodes, gap) {
    const w = document.createElement('div'); w.style.display = 'flex';
    w.style.alignItems = 'center'; w.style.gap = (gap || 10) + 'px';
    nodes.forEach(n => w.appendChild(n)); return w;
  }

  /* ===== enclosing frame (HudPanel as the deck border) ===== */
  at(HUD.panel({ width: 1600, height: 1000, notch: 26, bracket: 46, fill: false }), 0, 0);

  /* ===== FLOOR: perspective grid strip — the only grid in the HUD ===== */
  at(HUD.floorGrid({ width: 1560, height: 165 }), 20, 830);

  /* ===== CENTERPIECE ===== */
  atC(HUD.coreReactor({ size: 560 }), 760, 478, 'core-reactor');
  label('SCN.04', 588, 236); label('LNK.77', 908, 636);

  /* ===== TOP-LEFT (actual-ref corner): boxed EQ, dashed square w/ corner
     squares, diagonal capsule rails + hatch stripes, top traces ===== */
  // long two-tone bar chart inside a broken-line box — few, LONG dashes
  at(HUD.dashedSquare({ width: 340, height: 72, cornerStyle: 'none',
    inset: 1, dash: '66 30' }), 40, 18);
  at(HUD.equalizer({ bars: 42, barWidth: 4, gap: 3.5, height: 48, mixed: true,
    baseline: { left: 8, cap: false }, role: 'audio' }), 50, 26);
  at(HUD.tickStrip({ count: 26, step: 12, h: 8 }), 50, 94);
  // ornament cluster right of the box — dashed square with solid corner
  // squares, capsule rails climbing 45deg, hatch stripe pack, dot traces
  at(HUD.dashedSquare({ size: 78, cornerStyle: 'squares', dash: '7 5' }), 442, 26);
  at(HUD.diagCandles({ size: 105, role: 'candles' }), 516, 10);
  at(HUD.hatchStripes({ count: 7, gap: 8, len: 56 }), 600, 4);
  // paired top rails with node dots reaching toward the banner
  at(HUD.circuitTrace({ width: 194, height: 10, start: 'none', end: 'fdot',
    paths: ['M 2 5 H 190'] }), 392, 5);
  at(HUD.circuitTrace({ width: 136, height: 10, start: 'none', end: 'fdot',
    paths: ['M 132 5 H 2'] }), 404, 17);
  // left rail: filled-dot cap, vertical drop, then a ~140deg inward break
  // toward the signal readout
  at(HUD.circuitTrace({ width: 64, height: 220, start: 'fdot', end: 'dot',
    paths: ['M 5 2 V 150 l 52 62'] }), 33, 96);
  atC(HUD.donutGauge({ size: 96, value: 30, ticks: true, role: 'g1' }), 96, 146);
  atC(HUD.donutGauge({ size: 96, value: 50, ticks: true, role: 'g2' }), 211, 144);
  atC(HUD.donutGauge({ size: 96, value: 70, ticks: true, role: 'g3' }), 326, 143);
  // gauge-to-gauge links with bright node dots, spanning between the tick halos
  at(HUD.circuitTrace({ width: 25, height: 8, node: false,
    paths: ['M 1 4 H 24'] }), 142, 141);
  atC(HUD.nodeDot({ r: 4 }), 154, 145);
  at(HUD.circuitTrace({ width: 25, height: 8, node: false,
    paths: ['M 1 4 H 24'] }), 257, 140);
  atC(HUD.nodeDot({ r: 4 }), 269, 144);
  label('HUD INTERFACE TECHNOLOGY', 132, 196);
  // underline rail beneath the label, filled dots both ends, spanning the matrix
  at(HUD.circuitTrace({ width: 466, height: 10, start: 'fdot', end: 'fdot',
    paths: ['M 5 5 H 461'] }), 118, 210);
  at(HUD.dotMatrix({ rows: 6, cols: 58, cell: 9, size: 4, fade: true,
    gapCols: [12, 27, 42] }), 60, 224);
  (function signalRow() {
    // ref renders 5.232145 as a micro decimal readout (dim mono), not a key number
    const sig = document.createElement('div');
    sig.className = 'lbl'; sig.style.position = 'static'; sig.style.fontSize = '11px';
    sig.textContent = '5.232145'; sig.dataset.role = 'signal';
    at(row([
      sig,
      HUD.circuitTrace({ width: 26, height: 10, start: 'circle', end: 'none',
        paths: ['M 5 5 H 24'] }),
      HUD.dataBar({ width: 156, segments: 12, value: 66, flat: true, role: 'prog' })
    ], 4), 92, 292);
  })();

  /* ===== LEFT-MID (actual-ref pass): holo cone + speedo 100% + wide
     VITALS strip + left-edge column + corner-square cluster ===== */
  at(HUD.holoCone({ width: 170, height: 145 }), 95, 330);
  label('8.235687', 46, 430);
  at(HUD.speedoCluster({ value: 100, role: 'ring100' }), 292, 342);
  // connector between cone and speedo (ref): node dot, vertical drop past
  // the ring, 45deg elbow, run under it ending in a dot below its right edge
  at(HUD.circuitTrace({ width: 236, height: 150, start: 'fdot', end: 'fdot',
    paths: ['M 4 2 V 76 l 64 64 H 224'] }), 236, 334);
  (function vitals() {
    const w = document.createElement('div');
    w.style.cssText = 'position:relative;width:285px;height:140px';
    const frame = HUD.ecgPanel({ width: 285, height: 140 });
    frame.style.cssText = 'position:absolute;left:0;top:0';
    w.appendChild(frame);
    // one-shot ref trace: tiny wiggle, three bunched rising spikes, deep V,
    // medium bumps, one tallest spike, long flatline into the arrow
    const wv = HUD.waveMonitor({ width: 200, height: 84, role: 'ecg', arrow: true,
      profile: [[16, 0], [4, -6], [4, 10], [4, -6], [4, 4],
                [4, -22], [4, 26], [4, -32], [5, 36], [4, -34], [5, 28], [8, -4],
                [6, 26], [6, -28],
                [8, 6], [8, -8], [8, 6],
                [5, -40], [6, 44], [6, -8], [10, 2]] });
    wv.style.cssText = 'position:absolute;left:56px;top:24px';
    w.appendChild(wv);
    const rd = HUD.statReadout({ label: '', value: '1.276', size: 10, role: 'vit-val' });
    rd.style.cssText = 'position:absolute;left:22px;top:50px';
    w.appendChild(rd);
    at(w, 138, 512);
  })();
  // left-edge column: rails, mini corner-square, striped bar trio
  at(HUD.circuitTrace({ width: 40, height: 330, node: false, start: 'none', end: 'square',
    paths: ['M 8 2 V 118 M 8 130 V 320', 'M 22 46 V 200 M 22 212 V 262',
            'M 4 40 h 8 M 4 88 h 8 M 4 168 h 8 M 4 236 h 8 M 4 292 h 8'] }), 12, 470);
  at(HUD.nodeSquare({ size: 46 }), 48, 578);
  at(HUD.barStack({ dir: 'v', seg: true, thick: 12, gap: 5,
    bars: [[142, 0], [100, 0], [128, 0]] }), 54, 608);
  // stub linking the vitals panel's BL chamfer to the corner-square below
  at(HUD.circuitTrace({ width: 30, height: 26, node: false,
    paths: ['M 24 2 l -20 20'] }), 134, 646);
  // corner-square cluster row: square, boxed slot bar, dot row, hatch row
  at(HUD.nodeSquare({ size: 64, node: 'square' }), 142, 667);
  (function segBox() {
    const w = document.createElement('div');
    w.style.cssText = 'position:relative;width:144px;height:30px';
    const box = HUD.dashedSquare({ width: 144, height: 30, cornerStyle: 'none', dash: 'none', inset: 1 });
    box.style.cssText = 'position:absolute;left:0;top:0';
    const bar = HUD.dataBar({ width: 134, segments: 19, value: 74, flat: true, role: 'seg' });
    bar.style.cssText = 'position:absolute;left:5px;top:-2px';
    w.appendChild(box); w.appendChild(bar);
    at(w, 236, 664);
  })();
  at(HUD.circleGrid({ rows: 1, cols: 9, r: 3.5 }), 238, 696);
  at(HUD.hatchStripes({ count: 8, gap: 11, len: 13 }), 238, 710);
  at(HUD.circuitTrace({ width: 40, height: 48, start: 'fdot', end: 'none',
    paths: ['M 4 4 V 26 l 18 18'] }), 366, 722);
  // open binary block: stream + long string readout
  at(HUD.binaryStream({ rows: 4, cols: 16, cell: 11 }), 432, 706);
  label('0.0101001110110011101001', 434, 764);
  at(HUD.circuitTrace({ width: 90, height: 44 }), 618, 728);
  // twin stat panels (ref): 75% tucked under the reactor fringe, 100% below
  at(HUD.statPanel({ width: 206, height: 150, value: '75', decimal: '0.002157' }), 437, 528);
  at(HUD.statPanel({ width: 200, height: 144, value: '100', decimal: '0.002157', role: 'p100' }), 140, 752);

  /* ===== LEFT EDGE + BOTTOM-LEFT: rings + equalizers ===== */
  atC(HUD.miniRings({ rings: [[13, 0.7], [15, 0.45]] }), 92, 902);
  at(HUD.equalizer({ bars: 6, barWidth: 8, gap: 6, height: 60, role: 'stacks' }), 172, 900);
  at(HUD.equalizer({ bars: 20, height: 46, role: 'spectrum' }), 408, 916);

  /* ===== TOP-MIDDLE BANNER STRIP (actual-ref pass 2) =====
     slanted banner parallelogram; inside: wireframe sphere, mirrored
     bar column, broken ring, solid play triangle. Above: descending
     mini chart + long node rails. Right: circle grid, pill, waffle. */
  at(HUD.bannerFrame({ width: 560, height: 158, tlOff: 95, topEnd: 365 }), 560, 70);
  atC(HUD.fanRosette({ size: 130, role: 'emblem' }), 726, 152);
  atC(HUD.mirrorBars({ rows: 18, width: 124, height: 108 }), 857, 166);
  // broken ring — the accent line's terminating node — with its small
  // companion circle at the gap (ref "headphone")
  atC(HUD.miniRings({ rings: [[30, 0.78]], strokeWidth: 3, centerDot: false,
    endDot: true }), 995, 189);
  atC(HUD.circleGrid({ rows: 1, cols: 1, r: 9 }), 966, 205);
  // arrowhead wedge just RIGHT of the tip: its hypotenuse ascends to mirror
  // the descent, flat bottom riding the tail line
  at(HUD.solidTriangle({ size: 65, dir: 'wedge' }), 1085, 162);
  at(HUD.circuitTrace({ width: 130, height: 8, node: false,
    paths: ['M 2 4 H 116'] }), 1081, 223);
  // rail running left from the mid-slant node dot toward the candle cluster
  at(HUD.circuitTrace({ width: 110, height: 8, node: false,
    paths: ['M 1 4 H 103'] }), 505, 146);
  // exit rail off the mid-descent node dot: 45deg up past the banner top,
  // then a long run right ending in a far fdot
  at(HUD.circuitTrace({ width: 220, height: 100, start: 'none', end: 'fdot',
    paths: ['M 2 93 l 87 -87 H 215'] }), 983, 50);
  // descending mini chart sitting on the top frame line, with stem
  at(HUD.circuitTrace({ width: 8, height: 42, node: false,
    paths: ['M 4 0 V 40'] }), 826, 2);
  at(HUD.equalizer({ bars: 9, barWidth: 5, gap: 4, height: 36, decay: true,
    role: 'minichart' }), 834, 6);
  // long rails: left one bends 45deg down into the banner's TL corner dot
  at(HUD.circuitTrace({ width: 186, height: 56, start: 'fdot', end: 'none',
    paths: ['M 5 5 H 134 l 46 46'] }), 470, 18);
  at(HUD.circuitTrace({ width: 40, height: 12, start: 'none', end: 'square',
    paths: ['M 2 6 H 34'] }), 993, 34);
  at(HUD.circuitTrace({ width: 250, height: 12, start: 'none', end: 'fdot',
    paths: ['M 2 6 H 246'] }), 1035, 34);
  at(HUD.circuitTrace({ width: 175, height: 10, start: 'none', end: 'fdot',
    paths: ['M 2 5 H 170'] }), 1075, 83);
  // status circle grid right of the banner's top edge
  at(HUD.circleGrid({ rows: 2, cols: 3, r: 8 }), 1049, 66);
  // right-edge cluster: tilted pill, waffle grid panel + triangle, hatches,
  // dashed capsule with segment bar
  (function pillTilt() {
    const w = document.createElement('div');
    w.style.transform = 'rotate(-7deg)'; w.style.transformOrigin = 'left center';
    w.appendChild(HUD.pillOutline({ width: 117, height: 42, inner: true }));
    at(w, 1158, 92);
  })();
  at(HUD.waffle({ rows: 5, cols: 9, cell: 10, skew: -14 }), 1178, 131);
  atC(HUD.solidTriangle({ size: 30, dir: 'right' }), 1284, 186);
  at(HUD.hatchStripes({ count: 10, gap: 7, len: 18 }), 1212, 189);
  at(HUD.pillOutline({ width: 160, height: 26, dash: '6 5' }), 1166, 217);
  at(HUD.dataBar({ width: 130, segments: 10, value: 70, flat: true }), 1181, 224);

  /* ===== TOP-RIGHT: HP dial + binary + hex grid + capsule bar =====
     (holding positions clear of the banner strip until the region-3
     pass rebuilds this corner against the actual reference) */
  label('HP', 1318, 64, true);
  atC(HUD.radialGauge({ size: 74, value: 99, role: 'hp' }), 1372, 100);
  at(HUD.binaryStream({ rows: 1, cols: 16, cell: 11 }), 1330, 14);
  at(HUD.hexCluster({ rows: 2, cols: 5, r: 12 }), 1420, 140);
  at(HUD.tickStrip({ count: 8, step: 15, h: 16 }), 1180, 262);
  at(HUD.dataBar({ width: 160, segments: 12, value: 64, role: 'cap' }), 1400, 44);

  /* ===== RIGHT: pie + battery + labels ===== */
  atC(HUD.pieIndicator({ size: 110, value: 35, role: 'pie' }), 1236, 300);
  label('35%', 1298, 252, true);
  (function battery() {
    const w = document.createElement('div');
    w.style.transform = 'rotate(-90deg)'; w.style.transformOrigin = 'top left';
    w.appendChild(HUD.dataBar({ width: 94, segments: 5, value: 75, role: 'bat' }));
    at(w, 1326, 348);
  })();
  label('75%', 1330, 356);

  /* ===== RIGHT-MID: compass dial + bracket panel ===== */
  atC(HUD.dial({ size: 156, value: 70, role: 'compass' }), 1090, 442);
  (function bracket() {
    const p = HUD.panel({ width: 178, height: 148, notch: 14 });
    p._content.appendChild(col([
      HUD.miniRings({ rings: [[16, 0.6], [13, 0.85]] }),
      HUD.pieIndicator({ size: 54, value: 62 }),
      HUD.dataBar({ width: 140, segments: 9, value: 48 })
    ], 6));
    at(p, 1208, 372);
  })();

  /* ===== RIGHT-LOWER: flower cluster panel + long chevrons ===== */
  (function flower() {
    const p = HUD.panel({ width: 292, height: 74, notch: 12 });
    p._content.appendChild(row([
      HUD.miniRings({ rings: [[15, 0.5], [12, 0.8]] }),
      HUD.hexCluster({ rows: 2, cols: 3, r: 11 }),
      HUD.dotMatrix({ rows: 4, cols: 6, cell: 9 })
    ], 12));
    at(p, 974, 616);
  })();
  at(HUD.chevronRun({ count: 10, step: 24 }), 984, 700);

  /* ===== RIGHT "75%" plane panel ===== */
  (function plane() {
    const p = HUD.panel({ width: 156, height: 182, notch: 14, title: '' });
    p._content.appendChild(col([
      HUD.statReadout({ label: '', value: '75', unit: '%', size: 26, role: 'plane' }),
      HUD.tickStrip({ count: 9, step: 12 }),
      HUD.marker({ size: 26 })
    ], 10));
    at(p, 1290, 666);
  })();

  /* ===== BOTTOM: turbine dial + ring row + dish dial + capsule ===== */
  atC(HUD.miniRings({ rings: [[14, 0.8], [17, 0.5], [15, 0.7], [19, 0.4], [13, 0.85]] }), 412, 792);
  atC(HUD.dial({ size: 120, value: 84, role: 'dish' }), 1092, 862);
  at(row([
    HUD.statReadout({ label: '', value: '100', unit: '%', size: 18, role: 'cap100' }),
    HUD.dataBar({ width: 120, segments: 10, value: 100 })
  ], 10), 1360, 900);

  /* ===== CIRCUIT TRACES connecting regions ===== */
  at(HUD.circuitTrace({ width: 200, height: 80,
    paths: ['M 8 20 H 120 l 20 20 H 192', 'M 8 60 h 90 l 24 -24 H 192'] }), 470, 300);
  at(HUD.circuitTrace({ width: 220, height: 70,
    paths: ['M 8 16 H 140 l 20 20 H 212', 'M 60 62 V 40 l 18 -18 H 212'] }), 940, 520);
  at(HUD.circuitTrace({ width: 200, height: 60 }), 300, 946);

  /* ===== FILLER: binary streams, markers ===== */
  at(HUD.binaryStream({ rows: 4, cols: 26, cell: 12, role: 'dashband' }), 1000, 548);
  atC(HUD.marker({ size: 20 }), 470, 250);
  atC(HUD.marker({ size: 20 }), 1010, 320);
  atC(HUD.marker({ size: 20 }), 540, 770);
  atC(HUD.marker({ size: 20 }), 992, 560);

  // registry for future live-data wiring: every gauge/readout/bar carries a data-role.
  window.CLARVIS_HUD = { deck, roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role) };
</script>
</body>
</html>
