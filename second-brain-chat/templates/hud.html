<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CLARVIS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#010A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLARVIS">
<link rel="stylesheet" href="/static/hud/hud.css?v=11">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* fixed-proportion HUD stage, scaled to fit the viewport */
  #deck { position: absolute; width: 1600px; height: 1000px; left: 50%; top: 50%;
    transform-origin: center; }
  .n { position: absolute; }        /* placed node (top-left anchored) */
  .nc { position: absolute; transform: translate(-50%, -50%); }  /* centered */
  .lbl { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--hud-label);
    filter: var(--hud-glow); }
  .lbl.hi { color: var(--hud-cyan); }
</style>
</head>
<body class="hud-body">
<div id="deck"></div>

<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/hud/hud.js?v=11"></script>
<script>
  const deck = document.getElementById('deck');
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit); fit();
  HUD.scanlineOverlay();

  // ---- placement helpers ----
  function at(node, x, y, role) {        // top-left anchored
    const d = document.createElement('div'); d.className = 'n';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function atC(node, x, y, role) {        // center anchored
    const d = document.createElement('div'); d.className = 'nc';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    if (role) d.dataset.role = role;
    d.appendChild(node); deck.appendChild(d); return d;
  }
  function label(text, x, y, hi) {
    const d = document.createElement('div'); d.className = 'lbl' + (hi ? ' hi' : '');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text;
    deck.appendChild(d); return d;
  }

  /* ===== FLOOR: trapezoid plane across the whole bottom edge.
     Overshoots the 1600x1000 stage on both sides and below so it still
     bleeds to the screen edges when the viewport letterboxes the deck. ===== */
  at(HUD.floorPlane({ width: 2100, height: 215, topInset: 880,
    vanishX: 1050, rows: 5, role: 'floor' }), -250, 845);
  // name lying flat on the floor, receding to the same vanishing point (x=800),
  // letter-spaced wide so it stretches most of the way across the plane
  at(HUD.floorText({ text: 'C.L.A.R.V.I.S', size: 96, tilt: 63, spacing: 0.46,
    perspective: 1900, opacity: 0.85, role: 'floor-name' }), 800, 862);

  /* ===== ORBIT RINGS: slow counter-rotating marks hugging the
     reactor, filling the gap between it and the widget ring ===== */
  atC(HUD.orbitRing({ r: 305, kind: 'dots', dur: 120 }), 800, 430);
  atC(HUD.orbitRing({ r: 318, kind: 'arcs', dur: 210, reverse: true }), 800, 430);

  /* ===== WIDGET FRAMES: SIXTEEN outlines ringing the reactor at 360deg
     — five across the top, five across the bottom, three per flank.
     Shapes pull from the older HUD builds (banner descent, ECG bite
     notch, plane heptagon, stat-panel brackets). Append widgets into
     each frame's ._content, or via CLARVIS_HUD.frame(role). ===== */
  // top row
  at(HUD.widgetFrame({ width: 290, height: 88, shape: 'banner',   role: 'w-tl' }), 70, 14);
  at(HUD.widgetFrame({ width: 225, height: 88, shape: 'crest',    role: 'w-t1' }), 380, 14);
  at(HUD.widgetFrame({ width: 350, height: 88, shape: 'bite',     role: 'w-tc' }), 625, 14);
  at(HUD.widgetFrame({ width: 225, height: 88, shape: 'keystone', role: 'w-t2' }), 995, 14);
  at(HUD.widgetFrame({ width: 290, height: 88, shape: 'stack',    role: 'w-tr' }), 1240, 14);
  // left flank
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'hept',    role: 'w-l1' }), 40, 130);
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'hex',     role: 'w-l2' }), 40, 306);
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'blade',   role: 'w-l3' }), 40, 482);
  // right flank
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'bracket', role: 'w-r1' }), 1275, 130);
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'arrow',   role: 'w-r2' }), 1275, 306);
  at(HUD.widgetFrame({ width: 285, height: 158, shape: 'notch',   role: 'w-r3' }), 1275, 482);
  // bottom row
  at(HUD.widgetFrame({ width: 290, height: 88, shape: 'trapz',    role: 'w-bl' }), 70, 752);
  at(HUD.widgetFrame({ width: 225, height: 88, shape: 'slant',    role: 'w-b1' }), 380, 752);
  at(HUD.widgetFrame({ width: 350, height: 88, shape: 'hept',     role: 'w-bc' }), 625, 752);
  at(HUD.widgetFrame({ width: 225, height: 88, shape: 'tab',      role: 'w-b2' }), 995, 752);
  at(HUD.widgetFrame({ width: 290, height: 88, shape: 'keystone', role: 'w-br' }), 1240, 752);

  /* ===== SPINNERS + instruments in the side corridors ===== */
  atC(HUD.compassRing({ size: 104 }), 400, 208);
  atC(HUD.radarFan({ size: 104 }), 1200, 208);
  atC(HUD.flowerOfLife({ r: 30 }), 400, 690);
  atC(HUD.miniRings({ rings: [[20, 0.72], [14, 0.45]] }), 1200, 690);
  atC(HUD.donutGauge({ size: 92, value: 68, ticks: true }), 400, 430);
  atC(HUD.dial({ size: 96, value: 74 }), 1200, 430);
  atC(HUD.nodeSquare({ size: 34 }), 400, 330);
  atC(HUD.nodeSquare({ size: 34, node: 'square' }), 1200, 330);
  atC(HUD.marker({ size: 18 }), 400, 552);
  atC(HUD.marker({ size: 18 }), 1200, 552);

  /* ===== PATTERN FILL: corridors, thin strips, corner pockets ===== */
  at(HUD.dotMatrix({ rows: 3, cols: 13, cell: 9, size: 4, fade: true }), 50, 656);
  at(HUD.binaryStream({ rows: 3, cols: 11, cell: 11 }), 1282, 656);
  at(HUD.chevronRun({ count: 5, step: 17, h: 13 }), 50, 722);
  at(HUD.hatchStripes({ count: 7, gap: 11, len: 15 }), 1300, 716);
  at(HUD.tickStrip({ count: 12, step: 11, h: 9 }), 486, 112);
  at(HUD.tickStrip({ count: 12, step: 11, h: 9 }), 972, 112);
  at(HUD.circleGrid({ rows: 1, cols: 5, r: 6 }), 500, 726);
  at(HUD.hexCluster({ rows: 1, cols: 4, r: 11 }), 990, 722);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[34, 1], [52, 2], [24, 0]] }), 344, 620);
  at(HUD.barStack({ dir: 'v', thick: 8, gap: 7, bars: [[26, 0], [44, 2], [36, 1]] }), 1218, 620);
  at(HUD.candlesticks({ count: 5, width: 84, height: 58 }), 336, 118);
  at(HUD.mirrorBars({ rows: 10, width: 84, height: 62 }), 1184, 116);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 40 }), 340, 470);
  at(HUD.equalizer({ bars: 9, barWidth: 4, gap: 5, height: 40 }), 1196, 470);

  /* ===== micro readouts + link traces ===== */
  label('5.232145', 52, 636);
  label('0.002157', 1284, 636);
  label('8.235687', 340, 100, true);
  label('0.0015741', 1184, 100, true);
  label('MDL.19', 344, 600);
  label('LNK.77', 1220, 600);
  at(HUD.circuitTrace({ width: 90, height: 40, start: 'fdot', end: 'none',
    paths: ['M 4 4 H 44 l 20 20 H 86'] }), 330, 262);
  at(HUD.circuitTrace({ width: 90, height: 40, start: 'none', end: 'fdot',
    paths: ['M 4 24 H 42 l 20 -20 H 86'] }), 1180, 262);
  at(HUD.circuitTrace({ width: 90, height: 40, start: 'fdot', end: 'none',
    paths: ['M 4 30 H 44 l 20 -20 H 86'] }), 330, 646);
  at(HUD.circuitTrace({ width: 90, height: 40, start: 'none', end: 'fdot',
    paths: ['M 4 8 H 42 l 20 22 H 86'] }), 1180, 646);

  /* ===== CENTERPIECE: the arc reactor (core links to chat) ===== */
  atC(HUD.coreReactor({ size: 560, href: '/chat-classic', linkTarget: '_blank',
    linkTitle: 'Open CLARVIS chat' }), 800, 430, 'core-reactor');

  // registry for live-data wiring: every gauge/readout/bar carries a data-role.
  // frame(role) returns a widget frame's content box — append widgets straight into it.
  window.CLARVIS_HUD = {
    deck,
    roles: () => Array.from(deck.querySelectorAll('[data-role]')).map(n => n.dataset.role),
    frame: (role) => {
      const n = deck.querySelector(`[data-role="${role}"]`);
      return n && n._content ? n._content : null;
    }
  };
</script>
</body>
</html>
